<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roster Personal Vicuña</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#031128">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roster Vicuña">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* HUD azul marino: paneles translúcidos, esquinas en L cian, números monoespaciados con brillo. Un solo tema (oscuro). */
:root{
  --bg:#031128; --bg2:#06224a; --surface:rgba(9,38,84,.55); --panel:#071d3d; --ink:#dff2ff; --muted:#7fa6c9; --line:#14447f;
  --accent:#29c8ff; --accent-ink:#031128; --glow:0 0 12px rgba(41,200,255,.55);
  --good:#3de0a0; --warn:#ffb03b; --bad:#ff7a7a; --soft:rgba(41,200,255,.07);
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Barlow','Segoe UI',Arial,sans-serif;
  --font-mono:'JetBrains Mono',Consolas,'Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(1200px 700px at 70% -10%,var(--bg2),var(--bg) 70%) fixed;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:.04em;text-wrap:balance;text-transform:uppercase}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 48px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:18px 0 12px}
.brand{display:flex;gap:14px;align-items:center}
.logo{width:46px;height:46px;border-radius:12px;border:1px solid var(--accent);background:rgba(41,200,255,.08);box-shadow:var(--glow);display:grid;place-items:center}
.logo i{display:block;width:6px;border-radius:2px;margin:0 1.5px;align-self:end}
.logo{grid-auto-flow:column;align-content:center;justify-content:center;padding-bottom:11px}
.brand small{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-size:28px;line-height:1.05;font-weight:700}
.brand h1 em{font-style:normal;color:var(--accent);text-shadow:var(--glow)}
.status{font-family:var(--font-mono);font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);display:inline-block}
.dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)} .dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}
nav.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
nav.tabs button{flex:1;min-width:110px;background:none;border:0;padding:12px 16px;font-family:var(--font-body);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);box-shadow:0 8px 14px -10px var(--accent)}
.banner{background:var(--soft);border:1px solid var(--line);border-left:3px solid var(--warn);padding:10px 14px;border-radius:6px;margin-bottom:14px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:rgba(41,200,255,.06);padding:8px 14px;border-radius:8px;font-weight:600;letter-spacing:.03em}
.btn:hover{border-color:var(--accent);box-shadow:0 0 10px rgba(41,200,255,.25)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--glow)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:none}
.btn.small{padding:4px 10px;font-size:13px}
.btn.ghost{background:none}
.card,.tile,.sheet-wrap,.tbl-wrap{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.card{padding:16px}
.card::before,.tile::before,.sheet-wrap::before,.tbl-wrap::before{content:"";position:absolute;left:-1px;top:-1px;width:14px;height:14px;border-left:2px solid var(--accent);border-top:2px solid var(--accent);border-top-left-radius:10px;pointer-events:none;z-index:5}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--font-mono);font-size:12px;color:var(--muted);margin:10px 0 14px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);box-shadow:0 0 8px var(--c);vertical-align:-1px;margin-right:5px}
/* calendario */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cal-head h2{font-size:28px;min-width:230px}
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.12em;padding:4px 0}
.day{position:relative;min-height:92px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day:hover{border-color:var(--accent)}
.day.out{opacity:.4}
.day.we{background:rgba(179,136,255,.24);border-color:#b388ff;box-shadow:inset 0 4px 0 #b388ff}
.day.we .dn{color:#fff;background:#8c5cf0}
.day.hol{background:rgba(255,90,110,.34);border-color:#ff5a6e;box-shadow:inset 0 4px 0 #ff5a6e,inset 0 0 14px rgba(255,90,110,.3)}
.day.hol .dn{color:#fff;background:#ff3d57;font-weight:700}
.day.nl{background:rgba(255,90,110,.18);border:1px dashed #ff5a6e;box-shadow:inset 0 4px 0 rgba(255,90,110,.75)}
.day.nl .dn{color:#fff;background:#d6354d}
.day.today .dn{background:var(--accent);color:var(--accent-ink);box-shadow:var(--glow)}
.day.sel{outline:2px solid #fff;outline-offset:-2px}
.hol-l{font-family:var(--font-mono);font-size:10px;font-weight:700;color:#ff8a98;text-transform:uppercase;letter-spacing:.04em;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.day.we:not(.hol) .hol-l{color:#e3d4ff}
.day.today .dn{background:var(--accent);color:var(--accent-ink);box-shadow:var(--glow)}
.day.sel{outline:2px solid var(--accent);outline-offset:-2px;box-shadow:inset 0 0 14px rgba(41,200,255,.25)}
.dn{font-family:var(--font-mono);font-weight:600;font-size:12px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.dayhead{display:flex;align-items:center;gap:5px}
.dow.we{color:#c9a8ff}
.chips{display:flex;flex-direction:column;gap:2px}
.chip{font-style:normal;font-family:var(--font-mono);font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 26%,var(--panel));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.n{background:var(--c);color:var(--t,#031128);border-left-color:rgba(0,0,0,.4);box-shadow:0 0 10px color-mix(in srgb,var(--c) 55%,transparent)}
.chip.rel{--c:var(--muted);font-weight:500}
.mv{display:flex;flex-wrap:wrap;gap:2px 6px;font-family:var(--font-mono);font-size:10px;font-weight:700}
.mv b{color:var(--c);text-shadow:0 0 8px var(--c)}
.panel h3{font-size:22px;margin-bottom:8px;color:var(--accent);text-shadow:var(--glow)}
.panel h4{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:14px 0 6px;font-weight:600}
.person-line{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
.person-line small{color:var(--muted)}
.tag{display:inline-block;font-family:var(--font-mono);font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--soft);border:1px solid var(--line)}
.tag.ok{color:var(--good);border-color:var(--good)} .tag.warn{color:var(--warn);border-color:var(--warn)} .tag.bad{color:var(--bad);border-color:var(--bad)}
/* planilla */
.sheet-wrap,.tbl-wrap{overflow:auto}
table.sheet{border-collapse:separate;border-spacing:0;font-family:var(--font-mono);font-size:12px}
.sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;min-width:27px;height:27px;padding:0}
.sheet thead th{background:var(--panel);font-weight:600;position:sticky;top:0;z-index:2;color:var(--muted)}
.sheet th.name,.sheet td.name{position:sticky;left:0;z-index:3;text-align:left;min-width:230px;max-width:230px;padding:0 10px;background:var(--panel);white-space:nowrap;border-left:6px solid var(--c,var(--line));font-family:var(--font-body)}
.sheet thead th.name{z-index:4}
.sheet th.mo{text-align:left;padding-left:6px;font-family:var(--font-display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sheet td.we{background:rgba(179,136,255,.26)} .sheet th.we{background:#8c5cf0;color:#fff}
.sheet td.hol{background:rgba(255,90,110,.38)} .sheet th.hol{background:#ff3d57;color:#fff}
.sheet td.nl{background:rgba(255,90,110,.2)} .sheet th.nl{background:#b52d44;color:#fff}
.sheet th.tod{background:var(--accent);color:var(--accent-ink)}
.sheet td.d{background:color-mix(in srgb,var(--c) 30%,var(--panel));font-weight:700}
.sheet td.n{background:var(--c);color:var(--t,#031128);font-weight:700;box-shadow:inset 0 0 8px rgba(255,255,255,.2)}
.sheet td.mv{font-weight:700;color:var(--accent);text-shadow:var(--glow)}
/* personal */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.tile{padding:12px 14px;text-align:center}
.tile b{display:block;font-family:var(--font-mono);font-size:32px;line-height:1.1;color:var(--accent);text-shadow:var(--glow);font-variant-numeric:tabular-nums}
.tile span{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile.bad b{color:var(--bad);text-shadow:0 0 12px rgba(255,122,122,.5)} .tile.warn b{color:var(--warn);text-shadow:0 0 12px rgba(255,176,59,.5)}
.alerts li{margin:2px 0}
table.list{border-collapse:collapse;width:100%;min-width:760px}
.list th{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.list td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.list td small{display:block;color:var(--muted)}
.gchip{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
input[type=text],input[type=date],input[type=number],input[type=tel],select,textarea{width:100%;background:rgba(2,14,36,.75);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 8px rgba(41,200,255,.35);outline:none}
textarea{min-height:64px;resize:vertical}
input[type=color]{width:46px;height:34px;padding:2px;border:1px solid var(--line);border-radius:6px;background:rgba(2,14,36,.75)}
label.f{display:flex;flex-direction:column;gap:3px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea{font-family:var(--font-body);text-transform:none;letter-spacing:0;font-size:15px;color:var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(1,8,22,.75);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:50}
#modal.open{display:flex}
.sheetm{background:var(--bg);background:linear-gradient(180deg,#06224a,#031128 60%);border-radius:12px;max-width:860px;width:100%;border:1px solid var(--accent);box-shadow:0 0 30px rgba(41,200,255,.25)}
.sheetm header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);border-radius:12px 12px 0 0}
.sheetm header h2{font-size:24px;color:var(--accent);text-shadow:var(--glow)}
.sheetm .body{padding:16px 18px;display:grid;gap:16px}
.sheetm footer{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0;background:var(--surface)}
legend{font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:0 6px;color:var(--accent)}
.subrow{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.4fr auto;gap:8px;align-items:end;margin-bottom:8px}
.subrow.c2{grid-template-columns:1.6fr 1fr 1fr auto}
.empty{padding:28px;text-align:center;color:var(--muted)}
.gcard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin-bottom:12px}
.gcard .bar{width:8px;align-self:stretch;border-radius:6px;background:var(--c);box-shadow:0 0 12px var(--c)}
.next{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:8px}
body.soloD .chip.d{background:var(--c);color:var(--t,#031128);border-left-color:rgba(0,0,0,.4);box-shadow:0 0 10px color-mix(in srgb,var(--c) 45%,transparent)}
body.soloD .sheet td.d{background:var(--c);color:var(--t,#031128);box-shadow:inset 0 0 8px rgba(255,255,255,.2)}
::-webkit-calendar-picker-indicator{filter:invert(.8)}
@media (max-width:900px){
  .cal-wrap{grid-template-columns:minmax(0,1fr)}
  .subrow,.subrow.c2{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  .brand h1{font-size:24px}
  .day{min-height:64px;padding:3px}
  .chip{font-size:10px;padding:0 3px;border-left-width:4px}
  .chip.rel{display:none}
  .hol-l{display:none}
  .mv{font-size:10px}
  .grid{gap:2px}
  .cal-head h2{font-size:22px;min-width:0}
  nav.tabs button{min-width:96px;padding:10px 10px}
}
@media (prefers-reduced-motion:no-preference){ .btn{transition:border-color .12s,box-shadow .12s} }

.who{display:flex;gap:10px;align-items:center}.av{width:38px;height:48px;object-fit:cover;border-radius:5px;border:1px solid var(--line);flex:none}
.avbig{width:110px;height:140px;object-fit:cover;border-radius:8px;border:1px solid var(--accent);box-shadow:var(--glow)}
.avempty{width:110px;height:140px;border-radius:8px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:6px}
.docrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.docrow img{width:56px;height:56px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
.docrow .dn{flex:1;min-width:140px}.docrow small{display:block;color:var(--muted)}
#viewer{position:fixed;inset:0;z-index:120;background:rgba(2,8,20,.94);display:none;flex-direction:column;padding:12px;gap:10px}
#viewer.open{display:flex}#viewer .vb{display:flex;gap:10px;justify-content:flex-end}
#viewer .vc{flex:1;overflow:auto;text-align:center}#viewer img{max-width:100%;border-radius:6px}#viewer iframe{width:100%;height:100%;border:0;background:#fff}

#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
#login.on{display:flex}
#login form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:12px}
#login h2{margin:0;font-family:'Barlow Condensed',sans-serif;font-size:26px;color:var(--ink)}
#login p{margin:0;color:var(--muted);font-size:14px}
#login input{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:11px 12px;border-radius:6px;font-size:16px}
#login button{background:var(--accent);color:#031128;border:0;border-radius:6px;padding:12px;font-weight:700;font-size:16px;cursor:pointer}
#login .err{color:var(--bad);font-size:13px;min-height:16px}
.status .out{background:none;border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:2px 8px;font-size:11px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><i style="height:12px;background:#29c8ff"></i><i style="height:20px;background:#3de0a0"></i><i style="height:15px;background:#ffb03b"></i><i style="height:9px;background:#ff7a7a"></i></div>
      <div><h1>Roster <em>Personal Vicuña</em></h1><small>Freddy El Taller S.R.L. · Área Operaciones y Capacitación</small></div>
    </div>
    <div class="status" id="status"><span class="dot warn"></span><span>Conectando…</span></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<div id="viewer"></div>
<div id="login"><form id="loginForm" autocomplete="on">
<h2>Roster Personal Vicuña</h2><p>Ingresá con tu usuario para ver el roster y los datos del personal.</p>
<input id="lEmail" type="email" placeholder="Correo" autocomplete="username" required>
<input id="lPass" type="password" placeholder="Contraseña" autocomplete="current-password" required>
<div class="err" id="lErr"></div><button type="submit">Ingresar</button></form></div>
<div id="modal" role="dialog" aria-modal="true" aria-label="Ficha de personal"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
'use strict';
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dnOf=iso=>{const p=String(iso||'').split('-').map(Number);return p.length===3&&!p.some(isNaN)?Math.round(Date.UTC(p[0],p[1]-1,p[2])/864e5):NaN};
const isoOf=dn=>{const t=new Date(dn*864e5);return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate())};
const todayDn=()=>{const t=new Date();return Math.round(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/864e5)};
const DOW=['dom','lun','mar','mié','jue','vie','sáb'];
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const dowOf=dn=>new Date(dn*864e5).getUTCDay();
const ymd=dn=>{const t=new Date(dn*864e5);return {y:t.getUTCFullYear(),m:t.getUTCMonth(),d:t.getUTCDate()}};
const fmtLong=dn=>{const x=ymd(dn);return DOW[dowOf(dn)]+' '+x.d+' de '+MES[x.m]+' de '+x.y};
const fmtShort=iso=>{const n=dnOf(iso);if(isNaN(n))return '';const x=ymd(n);return pad(x.d)+'/'+pad(x.m+1)+'/'+x.y};
const monthStart=dn=>{const x=ymd(dn);return Math.round(Date.UTC(x.y,x.m,1)/864e5)};
const addMonths=(dn,k)=>{const x=ymd(dn);return Math.round(Date.UTC(x.y,x.m+k,1)/864e5)};
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const PALETTE=['#1f6aa5','#b45309','#2f855a','#8e44ad','#c2185b','#00838f','#6d4c41','#455a64'];

/* ---------- estado ---------- */
const S={groups:{},people:{},nov:{},tab:'cal',month:monthStart(todayDn()),sel:todayDn(),
  filterG:'all',q:'',pl:{from:monthStart(todayDn()),span:42},db:null,conn:'loading',fer:{},loaded:{groups:false,people:false,novedades:false,feriados:false},slow:false,confirm:null};

/* ---------- lógica de turnos ---------- */
/* ciclo del grupo: sube (U) · días (D) · noches (N) · baja (X) · descanso */
function groupState(g,dn){
  const up=dnOf(g.subida); if(isNaN(up))return '';
  const d=+g.dias||0,n=+g.noches||0,r=+g.descanso||0, cyc=d+n+r; if(cyc<=0)return '';
  const k=(((dn-up)%cyc)+cyc)%cyc;
  if(k===0)return 'U'; if(k<=d)return 'D'; if(k<=d+n)return 'N'; if(k===d+n+1)return 'X'; return '';
}
function personState(p,dn){
  const g=p.grupo&&S.groups[p.grupo]; let st=g?groupState(g,dn):'';
  for(const n of novList()){
    if(n.personaId!==p.id)continue;
    const a=dnOf(n.desde),b=dnOf(n.hasta); if(isNaN(a)||isNaN(b))continue;
    if(n.tipo==='ausencia'){
      if(dn>=a&&dn<=b) st=(dn===a)?'X':'';
      else if(dn===b+1&&st==='X') st='';
    }else if(n.tipo==='cobertura'){
      const cp=S.people[n.cubreA]; const cg=cp&&S.groups[cp.grupo];
      if(dn>=a&&dn<=b){const s=cg?groupState(cg,dn):''; st=(s==='D'||s==='N')?s:'';}
      else if(dn===a-1) st='U';
      else if(dn===b+1) st='X';
    }
  }
  return st;
}
function colorOf(p,dn){
  const g=p.grupo&&S.groups[p.grupo]; if(g)return g.color;
  for(const n of novList()){
    if(n.personaId===p.id&&n.tipo==='cobertura'){const a=dnOf(n.desde),b=dnOf(n.hasta);
      if(dn>=a-1&&dn<=b+1){const cp=S.people[n.cubreA];const cg=cp&&S.groups[cp.grupo];if(cg)return cg.color;}}
  }
  return '#7a8896';
}
function dayInfo(dn){
  const duty=[],ups=[],downs=[];
  groupsList().forEach(g=>{const s=groupState(g,dn); if(s==='D'||s==='N')duty.push({g,s}); else if(s==='U')ups.push(g); else if(s==='X')downs.push(g);});
  const rel=peopleList().filter(p=>!p.grupo).map(p=>({p,s:personState(p,dn)})).filter(x=>x.s==='D'||x.s==='N');
  return {duty,ups,downs,rel};
}
/* vencimientos */
function dueInfo(iso){
  if(!iso)return {k:'none',txt:'Sin cargar',days:null};
  const d=dnOf(iso)-todayDn();
  if(d<0)return {k:'bad',txt:'Vencido hace '+(-d)+' d',days:d};
  if(d<=30)return {k:'warn',txt:'Vence en '+d+' d',days:d};
  return {k:'ok',txt:'Vigente hasta '+fmtShort(iso),days:d};
}
function medStatus(p){
  const l=(p.medicos||[]).map(m=>m.vencimiento).filter(Boolean).sort();
  return dueInfo(l.length?l[l.length-1]:'');
}
function alertsList(){
  const out=[];
  peopleList().forEach(p=>{
    const l=(p.medicos||[]).filter(m=>m.vencimiento);
    if(l.length){const last=l.map(m=>m.vencimiento).sort().pop(); const i=dueInfo(last); if(i.k==='bad'||i.k==='warn')out.push({p,what:'Certificado médico',iso:last,i});}
    (p.certs||[]).forEach(c=>{if(!c.vencimiento)return;const i=dueInfo(c.vencimiento);if(i.k==='bad'||i.k==='warn')out.push({p,what:c.nombre||'Certificado',iso:c.vencimiento,i});});
  });
  return out.sort((a,b)=>a.i.days-b.i.days);
}

/* ---------- base de datos ---------- */
const chain={}; const KEY={groups:'groups',people:'people',novedades:'nov',feriados:'fer'};
function put(col,id,data){
  const key=col+'/'+id; S[KEY[col]][id]=data; if(!S.db)saveLocal(); render();
  if(!S.db){return Promise.resolve();}
  setStatus('saving');
  chain[key]=(chain[key]||Promise.resolve()).then(()=>S.db.doc(key).set(data)).then(()=>setStatus('ok')).catch(e=>{console.error(e);setStatus('err',e&&e.message)});
  return chain[key];
}
function del(col,id){
  const key=col+'/'+id; delete S[KEY[col]][id]; if(!S.db)saveLocal(); render();
  if(!S.db)return Promise.resolve();
  setStatus('saving');
  chain[key]=(chain[key]||Promise.resolve()).then(()=>S.db.doc(key).delete()).then(()=>setStatus('ok')).catch(e=>{console.error(e);setStatus('err',e&&e.message)});
  return chain[key];
}
function setStatus(k,msg){
  S.status=k;
  const el=$('#status'); if(!el)return;
  const m={ok:['','Guardado'],saving:['warn','Guardando…'],err:['bad','No se pudo guardar'+(msg?': '+msg:'')],local:['warn','Modo local: se guarda solo en este navegador'],loading:['warn','Conectando…']}[k]||['',''];
  el.innerHTML='<span class="dot '+m[0]+'"></span><span>'+esc(m[1])+'</span>'+(S.user?'<span style="opacity:.7">'+esc(S.user)+'</span><button class="out" id="btnOut">Salir</button>':'');
  const bo=$('#btnOut'); if(bo)bo.onclick=()=>firebase.auth().signOut();
}
function subscribe(col,key){
  S.db.collection(col).onSnapshot(snap=>{
    const o={}; snap.docs.forEach(d=>{if(d.exists)o[d.id]=d.data();});
    S[key]=o; S.loaded[col]=true;
    if(!snap.metadata.fromCache){S.slow=false;}
    if(S.loaded.groups&&S.loaded.people&&S.loaded.novedades&&S.loaded.feriados&&S.status!=='saving')setStatus('ok');
    render();
  },err=>{console.error(err);setStatus('err',err&&err.code);});
}
/* ---------- Firebase (Auth + Realtime Database) ---------- */
let unsubs=[];
function makeDb(rdb){
  return {
    collection(c){return {onSnapshot(next,err){
      const ref=rdb.ref('roster/'+c); const ck='rosterCache.'+c;
      const mk=(o,fc)=>({docs:Object.keys(o||{}).map(id=>({id,exists:true,data:()=>o[id]})),metadata:{fromCache:fc}});
      try{const cached=JSON.parse(localStorage.getItem(ck)||'null'); if(cached)next(mk(cached,true));}catch(e){}
      const cb=ref.on('value',s=>{const v=s.val()||{}; try{localStorage.setItem(ck,JSON.stringify(v));}catch(e){} next(mk(v,false));},err);
      unsubs.push(()=>ref.off('value',cb));
      return ()=>ref.off('value',cb);
    }};},
    getDocs(pid){return rdb.ref('roster/docs/'+pid).once('value').then(s=>s.val()||{});},
    putDoc(pid,id,d){return rdb.ref('roster/docs/'+pid+'/'+id).set(JSON.parse(JSON.stringify(d)));},
    delDoc(pid,id){return rdb.ref('roster/docs/'+pid+'/'+id).remove();},
    delAllDocs(pid){return rdb.ref('roster/docs/'+pid).remove();},
    doc(path){const ref=rdb.ref('roster/'+path);return {
      set:d=>ref.set(JSON.parse(JSON.stringify(d))),
      delete:()=>ref.remove()
    };}
  };
}
function showLogin(on,msg){$('#login').classList.toggle('on',on);$('#lErr').textContent=msg||'';}
function detach(){unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];S.db=null;S.loaded={};}
async function initDb(){
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||JSON.stringify(cfg).includes('PEGAR_')){
    S.db=null;localInit();setStatus('local');render();return;
  }
  try{
    firebase.initializeApp(cfg);
    const auth=firebase.auth(); const rdb=firebase.database();
    $('#loginForm').addEventListener('submit',async e=>{
      e.preventDefault(); $('#lErr').textContent='';
      try{await auth.signInWithEmailAndPassword($('#lEmail').value.trim(),$('#lPass').value);}
      catch(er){$('#lErr').textContent='Correo o contraseña incorrectos.';}
    });
    auth.onAuthStateChanged(u=>{
      detach();
      if(!u){S.user='';S.groups={};S.people={};S.nov={};S.fer={};showLogin(true);setStatus('loading');render();return;}
      S.user=u.email; showLogin(false);
      S.db=makeDb(rdb); S.loaded={}; setStatus('loading');
      setTimeout(()=>{if(S.db&&!(S.loaded.groups&&S.loaded.people&&S.loaded.novedades&&S.loaded.feriados)){S.slow=true;render();}},10000);
      subscribe('groups','groups');subscribe('people','people');subscribe('novedades','nov');subscribe('feriados','fer');
    });
  }catch(e){console.error(e);S.db=null;localInit();setStatus('local');render();}
}

function imgToDataURL(file,maxD,q){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,maxD/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q));};im.src=r.result;};r.readAsDataURL(file);});}
function fileToDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>res(r.result);r.readAsDataURL(file);});}

    else data=await imgToDataURL(f,1600,.72);

});

    inp('f_bajaFecha','Fecha de baja',d.bajaFecha,'date')+inp('f_bajaMotivo','Motivo de la baja',d.bajaMotivo)+'</div><p class="next" style="margin:8px 0 0">Si lo pasás a "De baja", sale del calendario y de las listas pero conserva su ficha. Se ve con "Ver bajas" en Personal.</p></fieldset>'+
  '<fieldset><legend>Datos personales</legend><div class="fgrid">'+inp('f_dni','DNI',d.dni)+inp('f_cuil','CUIL',d.cuil)+inp('f_nacimiento','Fecha de nacimiento',d.nacimiento,'date')+inp('f_telefono','Teléfono',d.telefono,'tel')+inp('f_domicilio','Domicilio',d.domicilio)+inp('f_localidad','Localidad / CP',d.localidad)+inp('f_nacionalidad','Nacionalidad',d.nacionalidad)+inp('f_estadoCivil','Estado civil',d.estadoCivil)+inp('f_sangre','Grupo sanguíneo',d.sangre)+
    inp('f_emergNombre','Contacto de emergencia',d.emergNombre)+inp('f_emergTel','Teléfono de emergencia',d.emergTel,'tel')+'</div></fieldset>'+
  '<fieldset><legend>Estudios y trabajos anteriores</legend><div class="fgrid">'+inp('f_nivelEdu','Nivel educativo',d.nivelEdu)+inp('f_titulos','Títulos obtenidos',d.titulos)+'</div><label class="f" style="margin-top:8px">Trabajos anteriores (empresa, período, motivo)<textarea id="f_trabajos">'+esc(d.trabajos||'')+'</textarea></label></fieldset>'+
  '<fieldset><legend>Talles de ropa de trabajo</legend><div class="fgrid">'+inp('t_camisa','Camisa / remera',t.camisa)+inp('t_pantalon','Pantalón',t.pantalon)+inp('t_calzado','Calzado',t.calzado)+inp('t_campera','Campera / abrigo',t.campera)+inp('t_guantes','Guantes',t.guantes)+inp('t_obs','Observaciones',t.obs)+'</div></fieldset>'+
  '<fieldset><legend>Certificados médicos</legend>'+(meds||'<p class="next" style="margin:0 0 8px">Sin certificados médicos cargados.</p>')+'<button class="btn small" data-act="addmed">+ Agregar certificado médico</button></fieldset>'+
  '<fieldset><legend>Otros certificados y capacitaciones</legend>'+(certs||'<p class="next" style="margin:0 0 8px">Sin certificados cargados.</p>')+'<button class="btn small" data-act="addcert">+ Agregar certificado</button></fieldset>'+
  docsBlock()+
  '<fieldset><legend>Notas</legend><textarea id="f_notas">'+esc(d.notas||'')+'</textarea></fieldset>'+
  '</div><footer>'+(M.id?'<button class="btn danger" data-act="delperson">'+(S.confirm==='p:'+M.id?'Confirmar: borrar persona':'Borrar persona')+'</button><span class="spacer"></span>':'')+
  '<button class="btn" data-act="closem">Cancelar</button><button class="btn primary" data-act="saveperson">Guardar</button></footer></div>';
}
function savePerson(){
  readForm(); const d=M.d;
  if(!d.nombre){alert_('Falta el nombre.');return;}
  d.activo=(fv('f_estado')!=='baja'); const id=M.id||uid('p');
  put('people',id,d); closeModal();
}
function alert_(msg){let e=$('#m_err');if(!e){const f=$('#modal footer');if(!f)return;e=document.createElement('span');e.id='m_err';e.style.cssText='color:var(--bad);font-size:13px;align-self:center';f.prepend(e);}e.textContent=msg;}

/* ---------- acciones ---------- */
function copyText(txt){
  const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
  if(!ok&&navigator.clipboard){return navigator.clipboard.writeText(txt).then(()=>true,()=>false);}
  return Promise.resolve(ok);
}
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]'); if(!el)return; const a=el.dataset.act;
  switch(a){
    case 'tab':S.tab=el.dataset.v;S.confirm=null;render();break;
    case 'day':S.sel=+el.dataset.dn;{const x=ymd(S.sel);if(S.sel<S.month||S.sel>=addMonths(S.month,1))S.month=monthStart(S.sel);}render();
      if(window.innerWidth<=900){const p=document.querySelector('.panel');if(p)p.scrollIntoView({behavior:'smooth',block:'nearest'});}break;
    case 'mprev':S.month=addMonths(S.month,-1);render();break;
    case 'mnext':S.month=addMonths(S.month,1);render();break;
    case 'mtoday':S.month=monthStart(todayDn());S.sel=todayDn();render();break;
    case 'pprev':S.pl.from-=7;render();break;
    case 'pnext':S.pl.from+=7;render();break;
    case 'add':openModal(null);break;
    case 'edit':S.confirm=null;openModal(el.dataset.id);break;
    case 'closem':S.confirm=null;closeModal();break;
    case 'saveperson':savePerson();break;
    case 'togbajas':S.showBajas=!S.showBajas;render();break;
    case 'rmfoto':readForm();M.d.foto='';drawModal();break;
    case 'viewdoc':if(M&&M.docs&&M.docs[el.dataset.id])openViewer(M.docs[el.dataset.id]);break;
    case 'closeviewer':$('#viewer').classList.remove('open');$('#viewer').innerHTML='';break;
    case 'rmdoc':{const id=el.dataset.id;if(S.confirm==='d:'+id){S.confirm=null;const mid=M.id;S.db.delDoc(mid,id).then(()=>{if(M&&M.id===mid){readForm();delete M.docs[id];drawModal();}}).catch(er=>console.error(er));}else{S.confirm='d:'+id;readForm();drawModal();}break;}
    case 'addmed':readForm();M.d.medicos.push({tipo:'Periódico',emision:'',vencimiento:'',obs:''});drawModal();break;
    case 'addcert':readForm();M.d.certs.push({nombre:'',emision:'',vencimiento:''});drawModal();break;
    case 'rmmed':readForm();M.d.medicos.splice(+el.dataset.i,1);drawModal();break;
    case 'rmcert':readForm();M.d.certs.splice(+el.dataset.i,1);drawModal();break;
    case 'delperson':
      if(S.confirm==='p:'+M.id){const id=M.id;S.confirm=null;closeModal();if(S.db&&S.db.delAllDocs)S.db.delAllDocs(id);del('people',id);}
      else{readForm();S.confirm='p:'+M.id;drawModal();}
      break;
    case 'copytalles':{
      const rows=[['Nombre','Función','Grupo','Camisa','Pantalón','Calzado','Campera','Guantes','Observaciones']];
      peopleList().forEach(p=>{const t=p.talles||{},g=p.grupo&&S.groups[p.grupo];rows.push([p.nombre,p.funcion||'',g?g.nombre:'Relevo',t.camisa||'',t.pantalon||'',t.calzado||'',t.campera||'',t.guantes||'',t.obs||'']);});
      copyText(rows.map(r=>r.join('\t')).join('\n')).then(ok=>{el.textContent=ok?'Copiado. Pegalo en Excel':'No se pudo copiar';setTimeout(()=>{el.textContent='Copiar lista de talles';},2500);});
      break;}
    case 'addnov':{
      const tipo=fv('n_tipo'),pers=fv('n_pers'),desde=fv('n_desde'),hasta=fv('n_hasta'),cubre=fv('n_cubre'),nota=fv('n_nota'),err=$('#n_err');
      if(!pers||!desde||!hasta){err.textContent='Completá persona, desde y hasta.';break;}
      if(dnOf(hasta)<dnOf(desde)){err.textContent='La fecha final es anterior a la inicial.';break;}
      if(tipo==='cobertura'&&(!cubre||cubre===pers)){err.textContent='Elegí a quién cubre (otra persona).';break;}
      const n={tipo,personaId:pers,desde,hasta,nota}; if(tipo==='cobertura')n.cubreA=cubre;
      put('novedades',uid('n'),n);break;}
    case 'delnov':
      if(S.confirm==='n:'+el.dataset.id){S.confirm=null;del('novedades',el.dataset.id);}else{S.confirm='n:'+el.dataset.id;render();}
      break;
    case 'addgroup':{
      const gs=groupsList(),i=gs.length; let t=todayDn(); while(dowOf(t)!==3)t++;
      put('groups',uid('g'),{nombre:'Grupo '+(i+1),color:PALETTE[i%PALETTE.length],subida:isoOf(t),dias:14,noches:0,descanso:14,orden:i+1});break;}
    case 'savegroup':{
      const id=el.dataset.id,g=clone(S.groups[id]);
      document.querySelectorAll('[data-g="'+id+'"]').forEach(i=>{const f=i.dataset.f;g[f]=(f==='dias'||f==='noches'||f==='descanso')?(+i.value||0):i.value;});
      if(!g.nombre)g.nombre='Grupo'; put('groups',id,g);break;}
    case 'addfer':{
      const fecha=fv('fe_fecha'),nombre=fv('fe_nombre'),tipo=fv('fe_tipo'),err=$('#fe_err');
      if(isNaN(dnOf(fecha))||!nombre){err.textContent='Completá la fecha y el nombre.';break;}
      put('feriados','f'+fecha.replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,5),{fecha,nombre,tipo});break;}
    case 'delfer':
      if(S.confirm==='f:'+el.dataset.id){S.confirm=null;del('feriados',el.dataset.id);}else{S.confirm='f:'+el.dataset.id;render();}
      break;
    case 'delgroup':{
      const id=el.dataset.id;
      if(peopleList().some(p=>p.grupo===id)){S.confirm=null;alertBanner('Mové o quitá al personal de este grupo antes de borrarlo.');break;}
      if(S.confirm==='g:'+id){S.confirm=null;del('groups',id);}else{S.confirm='g:'+id;render();}
      break;}
  }
});
function alertBanner(msg){const b=$('#banner');b.innerHTML='<div class="banner">'+esc(msg)+'</div>';setTimeout(render,4000);}
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){S.q=ev.target.value;render();}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='fg'){S.filterG=t.value;render();}
  else if(t.id==='pl_from'){const n=dnOf(t.value);if(!isNaN(n)){S.pl.from=n;render();}}
  else if(t.id==='pl_span'){S.pl.span=+t.value;render();}
  else if(t.id==='n_tipo')syncNovForm();
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&M)closeModal();});
$('#modal').addEventListener('mousedown',ev=>{if(ev.target.id==='modal'){/* no cerrar por click afuera para no perder datos */}});

setStatus('loading'); render(); initDb();
})();
</script>
