function otRenderGraficos(){
  if(typeof otData==='undefined' || !otData) return '';
  const all=[]; Object.values(otData).forEach(arr=>arr.forEach(o=>all.push(o)));
  if(!all.length) return '';

  // 1. Repuestos más consumidos
  const repCnt={}, repUsd={};
  all.forEach(o=>(o.repuestos||[]).forEach(r=>{ repCnt[r.desc]=(repCnt[r.desc]||0)+r.cant; repUsd[r.desc]=(repUsd[r.desc]||0)+(r.usd||0); }));
  const topRep=Object.entries(repCnt).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxRep=Math.max(...topRep.map(x=>x[1]),1);

  // 2. Intervenciones por tipo
  const tipoCnt={PM:0,Correctivo:0,Otro:0};
  all.forEach(o=>tipoCnt[o.tipo]=(tipoCnt[o.tipo]||0)+1);

  // 3. Costo por mes
  const mesUsd={};
  all.forEach(o=>{ if(o.fecha_iso){ const m=o.fecha_iso.slice(0,7); mesUsd[m]=(mesUsd[m]||0)+(o.total_usd||0);} });
  const meses=Object.entries(mesUsd).sort();
  const maxMes=Math.max(...meses.map(x=>x[1]),1);

  // 4. Ranking unidades por gasto
  const uniUsd={};
  Object.entries(otData).forEach(([p,arr])=>{ uniUsd[p]=arr.reduce((s,o)=>s+(o.total_usd||0),0); });
  const topUni=Object.entries(uniUsd).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxUni=Math.max(...topUni.map(x=>x[1]),1);

  const bar=(label,val,max,color,extra)=>`
    <div style="margin-bottom:7px;">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:2px;"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%;">${label}</span><span style="color:var(--text3);">${extra}</span></div>
      <div style="background:var(--border);border-radius:6px;height:8px;overflow:hidden;"><div style="width:${Math.max(4,val/max*100)}%;height:100%;background:${color};border-radius:6px;"></div></div>
    </div>`;

  const card=(titulo,contenido)=>`
    <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;">
      <div style="font-size:13px;font-weight:700;margin-bottom:10px;">${titulo}</div>${contenido}</div>`;

  const g1=topRep.map(([d,c])=>bar(d,c,maxRep,'#5856D6',`${c} u · USD ${(repUsd[d]||0).toLocaleString('es-AR')}`)).join('');
  const totInt=tipoCnt.PM+tipoCnt.Correctivo+tipoCnt.Otro;
  const g2=`<div style="display:flex;gap:8px;">
      <div style="flex:1;text-align:center;"><div style="font-size:22px;font-weight:700;color:#34C759;">${tipoCnt.PM}</div><div style="font-size:11px;color:var(--text3);">PM</div></div>
      <div style="flex:1;text-align:center;"><div style="font-size:22px;font-weight:700;color:#FF9500;">${tipoCnt.Correctivo}</div><div style="font-size:11px;color:var(--text3);">Correctivo</div></div>
      <div style="flex:1;text-align:center;"><div style="font-size:22px;font-weight:700;color:#8E8E93;">${tipoCnt.Otro}</div><div style="font-size:11px;color:var(--text3);">Otro</div></div>
    </div>`;
  const g3=meses.map(([m,v])=>{ const d=new Date(m+'-01T12:00:00'); const lbl=MONTHS[d.getMonth()]+' '+d.getFullYear(); return bar(lbl,v,maxMes,'#FF9500','USD '+v.toLocaleString('es-AR')); }).join('');
  const g4=topUni.map(([p,v])=>bar(p,v,maxUni,'#FF3B30','USD '+v.toLocaleString('es-AR'))).join('');

  return `<div style="padding:0 16px 8px;">
    <div class="sec-hdr" style="margin:6px 0 10px;">Análisis de mantenimiento</div>
    ${card('🔩 Repuestos más consumidos', g1)}
    ${card('🛠️ Intervenciones por tipo ('+totInt+')', g2)}
    ${card('💵 Costo por período', g3||'<div style="font-size:12px;color:var(--text3);">Sin datos de fecha</div>')}
    ${card('🚚 Ranking de unidades por gasto', g4)}
  </div>`;
}

/* ---------- Saneador: corrige turnos OT viejos sin pm/kmU/kmA ---------- */
function otSanearTurnos(){
  if(typeof events==='undefined' || !Array.isArray(events)) return false;
  let cambio=false;
  events.forEach(e=>{
    if(e.origenOT){ // turno generado por OT
      if(!e.pm || !PMS[e.pm]){ e.pm = 'CORR'; cambio=true; }
      if(typeof e.kmU!=='number'){ e.kmU = parseInt(e.km)||0; cambio=true; }
      if(typeof e.kmA!=='number'){ e.kmA = e.kmU||0; cambio=true; }
      if(typeof e.id!=='number'){ e.id = Date.now()+Math.floor(Math.random()*10000); cambio=true; }
      if(e.tipo){ delete e.tipo; cambio=true; }
      if(!e.cumplido){ e.cumplido = true; cambio=true; }
    }
  });
  if(cambio){
    try { events.forEach(e=>{ if(e.origenOT) db.ref('turnos').child(String(e.id)).set(e); }); } catch(err){}
  }
  return cambio;
}

/* ===== DASHBOARD (inyectado) ===== */
/* ==================== DASHBOARD (Resumen de flota) ====================
   Combina el estilo Veladero (estado de turnos, tipos de PM, por área,
   alertas) con datos de Vicuña (OT cumplidas, consumo de repuestos, costos).
   ===================================================================== */
function renderDashboard(c) {
  const evs = Array.isArray(events) ? events : [];

  // ---- Estado de turnos ----
  let pend=0, prox=0, venc=0, corr=0, pred=0, cumpl=0;
  evs.forEach(e=>{
    if(e.origenOT || e.cumplido){ cumpl++; if(e.pm==='CORR') corr++; return; }
    const pm = PMS[e.pm];
    if(e.pm==='CORR'){ corr++; return; }
    if(e.pm==='PRED'){ pred++; return; }
    const eDate = new Date(e.fecha+'T12:00:00');
    if(eDate < NOW_DAY){ venc++; }
    else if(pm && pm.km>0 && (e.kmA-e.kmU) >= pm.km*0.9){ prox++; }
    else { pend++; }
  });

  // ---- Tipos de PM ----
  const tipo = {PM5:0, PM10:0, CORR:0, PRED:0};
  evs.forEach(e=>{ if(tipo[e.pm]!==undefined) tipo[e.pm]++; });
  const maxTipo = Math.max(tipo.PM5, tipo.PM10, tipo.CORR, tipo.PRED, 1);

  // ---- Turnos por área ----
  const areas = {};
  evs.forEach(e=>{ const a=e.area||'Sin área'; areas[a]=(areas[a]||0)+1; });
  const areaArr = Object.entries(areas).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxArea = Math.max(...areaArr.map(x=>x[1]), 1);

  // ---- Datos de OT (Vicuña) ----
  const otAll=[]; if(typeof otData!=='undefined' && otData) Object.values(otData).forEach(arr=>arr.forEach(o=>otAll.push(o)));
  const nUnid = (typeof otData!=='undefined' && otData) ? Object.keys(otData).length : 0;
  let costoTotal=0, repTotal=0;
  otAll.forEach(o=>{ costoTotal+=(o.total_usd||0); repTotal+=(o.repuestos||[]).length; });

  // ---- Alertas (turnos vencidos / próximos, no cumplidos) ----
  const alertas = evs.filter(e=>{
    if(e.origenOT||e.cumplido) return false;
    const pm=PMS[e.pm]; const eDate=new Date(e.fecha+'T12:00:00');
    return eDate<NOW_DAY || (pm && pm.km>0 && (e.kmA-e.kmU)>=pm.km*0.9);
  }).sort((a,b)=> new Date(a.fecha)-new Date(b.fecha)).slice(0,8);

  // ---- Indicadores de flota: mes en curso vs. mes anterior ----
  // Horas de detención estimadas por tipo de evento (no se registra hora exacta
  // de entrada/salida, así que se usa una duración fija acordada por tipo).
  const HORAS_DETENCION = { PM5:4, INSP:1, CORR:2, PRED:1 };
  const totalFlotaDisp = FLOTA_VICUNA.length;

  const mesActualKey = TODAY.getFullYear() + '-' + String(TODAY.getMonth()+1).padStart(2,'0');
  const diasTranscurridos = TODAY.getDate(); // días del mes en curso ya pasados (incluye hoy)
  const fechaLimiteActual = mesActualKey + '-' + String(diasTranscurridos).padStart(2,'0');

  const prevMonthRef = new Date(TODAY.getFullYear(), TODAY.getMonth()-1, 1);
  const mesAnteriorKey = prevMonthRef.getFullYear() + '-' + String(prevMonthRef.getMonth()+1).padStart(2,'0');
  const diasMesAnterior = new Date(prevMonthRef.getFullYear(), prevMonthRef.getMonth()+1, 0).getDate(); // mes completo, ya terminó
  const fechaLimiteAnterior = mesAnteriorKey + '-' + String(diasMesAnterior).padStart(2,'0');

  // Calcula disponibilidad/MKBF/MTTR para un mes dado (mesKey) hasta fechaLimite
  // (hoy para el mes en curso, o el último día del mes si ya terminó).
  function calcIndicadoresMes(mesKey, diasDelMes, fechaLimite){
    let hProg=0, hImprev=0, eProg=0, eImprev=0;
    evs.forEach(e=>{
      if(!e.fecha || !e.fecha.startsWith(mesKey)) return;
      if(e.fecha > fechaLimite) return; // todavía no ocurrió, no cuenta
      const horas = HORAS_DETENCION[e.pm];
      if(horas===undefined) return;
      if(e.pm==='CORR'){ hImprev+=horas; eImprev++; } else { hProg+=horas; eProg++; }
    });
    const hTotal = hProg + hImprev;
    const hDisp = totalFlotaDisp * 24 * diasDelMes;
    const dispPct = hDisp>0 ? Math.max(0,(hDisp-hTotal)/hDisp*100) : 100;

    // Km recorridos por la flota en ese mes (lecturas de km_efectivo de las OT):
    // por patente, última lectura ANTES del mes vs. la más reciente hasta fechaLimite.
    let kmRec=0, unidadesKm=0;
    const unidadesSet = new Set();
    if (typeof otData !== 'undefined' && otData) {
      const inicioStr = mesKey + '-01';
      Object.keys(otData).forEach(patente=>{
        const arr = (otData[patente]||[]).filter(o=>o.fecha_iso&&o.km_efectivo).sort((a,b)=>a.fecha_iso.localeCompare(b.fecha_iso));
        let kmIni=null, kmFin=null;
        arr.forEach(o=>{
          if(o.fecha_iso < inicioStr) kmIni = o.km_efectivo;
          if(o.fecha_iso <= fechaLimite) kmFin = o.km_efectivo;
        });
        if(kmIni!==null && kmFin!==null && kmFin>kmIni){ kmRec += (kmFin-kmIni); unidadesKm++; unidadesSet.add(patente.toString().trim().toUpperCase()); }
      });
    }
    const mkbf = eImprev>0 ? (kmRec/eImprev) : null;

    // MKBF programado: km de las unidades con lectura ÷ PM realizados de ESAS mismas
    // unidades. Cuenta los PM de las OT (tipo PM) y de los rosters (tipo PM), sin
    // repetir el mismo PM (misma patente y fecha) si está en los dos. No incluye
    // las inspecciones mensuales ni los turnos agendados que no se hicieron.
    const pmKeys = new Set();
    const enRango = f => f && f.startsWith(mesKey) && f <= fechaLimite;
    Object.keys(otData||{}).forEach(pat=>{
      if(!unidadesSet.has(pat.toString().trim().toUpperCase())) return;
      (otData[pat]||[]).forEach(o=>{ if(o.tipo==='PM' && enRango(o.fecha_iso)) pmKeys.add(pat.toString().trim().toUpperCase()+'|'+o.fecha_iso); });
    });
    Object.values(reparacionesReales||{}).forEach(rep=>{
      const pat = (rep.patente||'').toString().trim().toUpperCase();
      if(!unidadesSet.has(pat) || !enRango(rep.fecha)) return;
      const t = (rep.tipo||'').toString().trim().toLowerCase();
      if (t==='pm' || t.startsWith('pm/') || t.startsWith('pm ')) pmKeys.add(pat+'|'+rep.fecha);
    });
    const nPM = pmKeys.size;
    const mkbfProg = nPM>0 ? (kmRec/nPM) : null;

    // MTTR real: promedio de "tiempoReparacionHoras" de los rosters cargados
    // para ese mes, excluyendo los que dicen "PM" (eso es mantenimiento
    // programado, no una reparación imprevista). Si el mes no tiene registros
    // reales todavía, se cae a la hora fija estimada (HORAS_DETENCION.CORR).
    let sumaHorasReales=0, cantReales=0;
    Object.values(reparacionesReales||{}).forEach(rep=>{
      if(!rep.fecha || !rep.fecha.startsWith(mesKey)) return;
      if(rep.fecha > fechaLimite) return;
      if(typeof rep.tiempoReparacionHoras!=='number') return;
      if((rep.tipo||'').trim().toUpperCase().startsWith('PM')) return; // mantenimiento programado, no correctivo
      sumaHorasReales += rep.tiempoReparacionHoras;
      cantReales++;
    });
    const mttrReal = cantReales>0 ? (sumaHorasReales/cantReales) : null;

    return { hProg, hImprev, hTotal, eProg, eImprev, hDisp, dispPct, kmRec, unidadesKm, mkbf, mkbfProg, nPM, mttrReal, cantReales };
  }

  const indActual = calcIndicadoresMes(mesActualKey, diasTranscurridos, fechaLimiteActual);
  const indAnterior = calcIndicadoresMes(mesAnteriorKey, diasMesAnterior, fechaLimiteAnterior);
  const mttrActualVal = indActual.mttrReal!==null ? indActual.mttrReal : HORAS_DETENCION.CORR;
  const mttrAnteriorVal = indAnterior.mttrReal!==null ? indAnterior.mttrReal : HORAS_DETENCION.CORR;

  let nombreMesDisp = TODAY.toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  nombreMesDisp = nombreMesDisp.charAt(0).toUpperCase() + nombreMesDisp.slice(1);
  let nombreMesAnt = prevMonthRef.toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  nombreMesAnt = nombreMesAnt.charAt(0).toUpperCase() + nombreMesAnt.slice(1);
  const dispColor = indActual.dispPct>=99 ? '#34C759' : (indActual.dispPct>=97 ? '#FF9500' : '#FF3B30');
  const comp = (label, val) => `<div style="font-size:12px;color:var(--text3);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);">${label}: <strong style="color:var(--text2);">${val}</strong></div>`;

  // ===== HTML =====
  let html = `<div style="padding:14px 16px 30px;">`;

  // ---- Consumo del contrato (cargado a mano desde el Anexo E-2 / Estado de Pago) ----
  if (typeof esAdmin==='function' && esAdmin()) {
    html += `<button onclick="document.getElementById('inputEstadoPago').click()" style="width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-weight:600;font-size:13px;margin-bottom:8px;">💼 Cargar Estado de Pago (Excel)</button>
    <input type="file" id="inputEstadoPago" accept=".xlsx,.xls" style="display:none;" onchange="importarEstadoPago(this.files[0])">
    <button onclick="document.getElementById('inputRosterRep').click()" style="width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-weight:600;font-size:13px;margin-bottom:10px;">🔧 Cargar roster de reparaciones (Excel)</button>
    <input type="file" id="inputRosterRep" accept=".xlsx,.xls" style="display:none;" onchange="importarRosterReparaciones(this.files[0])">`;
  }
  if (estadoPagoData) {
    const ep = estadoPagoData;
    const pct = (ep.pctConsumidoTotal||0)*100;
    const epColor = pct<80 ? '#34C759' : (pct<95 ? '#FF9500' : '#FF3B30');
    const fmtUSDc = n => '$ '+(n||0).toLocaleString('es-AR',{maximumFractionDigits:0});
    html += `<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;">
      <div style="font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.04em;margin-bottom:6px;">CONSUMO DEL CONTRATO — EDP N° ${ep.numero||'?'}${ep.periodoHasta?' ('+ep.periodoHasta.split('-').reverse().join('/')+')':''}</div>
      <div style="font-size:32px;font-weight:800;color:${epColor};line-height:1.1;">${pct.toFixed(1)}%</div>
      <div style="background:var(--bg);border-radius:8px;height:8px;margin-top:8px;overflow:hidden;"><div style="background:${epColor};height:100%;width:${Math.min(100,pct)}%;"></div></div>
      <div style="font-size:12.5px;color:var(--text2);margin-top:8px;">${fmtUSDc(ep.valorAcumTotal)} consumido de ${fmtUSDc(ep.nuevoValorContrato)} — saldo restante ${fmtUSDc(ep.saldoRestante)}</div>
      <div style="font-size:11px;color:var(--text3);margin-top:2px;">Este período: ${fmtUSDc(ep.valorAcumPeriodo)} · Contrato ${ep.contrato||''}</div>
    </div>`;
  }

  html += `<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;">
    <div style="font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.04em;margin-bottom:6px;">DISPONIBILIDAD DE LA FLOTA — ${nombreMesDisp}</div>
    <div style="font-size:36px;font-weight:800;color:${dispColor};line-height:1.1;">${indActual.dispPct.toFixed(2)}%</div>
    <div style="font-size:12.5px;color:var(--text2);margin-top:4px;">${indActual.hTotal} hs de detención sobre ${indActual.hDisp.toLocaleString('es-AR')} hs disponibles (${diasTranscurridos} días) — ${indActual.hProg} hs / ${indActual.eProg} programadas, ${indActual.hImprev} hs / ${indActual.eImprev} imprevistos</div>
    ${comp('Mes anterior ('+nombreMesAnt+')', indAnterior.dispPct.toFixed(2)+'%')}
  </div>`;

  html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;">
      <div style="font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.04em;margin-bottom:8px;">MKBF</div>
      <div style="font-size:24px;font-weight:800;color:var(--text);line-height:1.1;">${indActual.mkbf!==null ? Math.round(indActual.mkbf).toLocaleString('es-AR') : '—'}<span style="font-size:13px;font-weight:600;color:var(--text3);"> km</span></div>
      <div style="font-size:11.5px;color:var(--text2);margin-top:4px;">Km medios entre fallas${indActual.eImprev>0 ? ` (${indActual.eImprev} correctivo${indActual.eImprev!==1?'s':''})` : ' — sin correctivos este mes'}</div>
      ${comp('Mes anterior', indAnterior.mkbf!==null ? Math.round(indAnterior.mkbf).toLocaleString('es-AR')+' km' : '—')}
    </div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;">
      <div style="font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.04em;margin-bottom:8px;">MKBF programado</div>
      <div style="font-size:24px;font-weight:800;color:var(--text);line-height:1.1;">${indActual.mkbfProg!==null ? Math.round(indActual.mkbfProg).toLocaleString('es-AR') : '—'}<span style="font-size:13px;font-weight:600;color:var(--text3);"> km</span></div>
      <div style="font-size:11.5px;color:var(--text2);margin-top:4px;">Km medios entre PM realizados${indActual.nPM>0 ? ` (${indActual.nPM} PM en unidades con lectura de km)` : ' — sin PM realizados este mes en unidades con lectura de km'}</div>
      ${comp('Mes anterior', indAnterior.mkbfProg!==null ? Math.round(indAnterior.mkbfProg).toLocaleString('es-AR')+' km' : '—')}
    </div>
  </div>
  <div style="font-size:11px;color:var(--text3);margin-bottom:10px;">${indActual.kmRec.toLocaleString('es-AR')} km recorridos por la flota este mes, en ${indActual.unidadesKm} unidad${indActual.unidadesKm!==1?'es':''} con lectura previa al mes · ${nombreMesAnt}: ${indAnterior.kmRec.toLocaleString('es-AR')} km en ${indAnterior.unidadesKm} unidad${indAnterior.unidadesKm!==1?'es':''}</div>
  <div style="margin-bottom:14px;">
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;">
      <div style="font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.04em;margin-bottom:8px;">MTTR</div>
      <div style="font-size:24px;font-weight:800;color:var(--text);line-height:1.1;">${mttrActualVal.toLocaleString('es-AR',{maximumFractionDigits:2})}<span style="font-size:13px;font-weight:600;color:var(--text3);"> hs</span></div>
      <div style="font-size:11.5px;color:var(--text2);margin-top:4px;">Tiempo medio de reparación${indActual.mttrReal!==null ? ` (real, ${indActual.cantReales} reparación${indActual.cantReales!==1?'es':''} cargada${indActual.cantReales!==1?'s':''})` : ' (estimado fijo, todavía sin datos reales este mes)'}</div>
      ${comp('Mes anterior', mttrAnteriorVal.toLocaleString('es-AR',{maximumFractionDigits:2})+' hs'+(indAnterior.mttrReal!==null?' (real)':' (estimado)'))}
    </div>
  </div>`;

  // ---- Horas hombre: consumidas vs. disponibles, por roster ----
  const horasConsumidasPorRoster = {};
  Object.values(reparacionesReales||{}).forEach(rep=>{
    if (typeof rep.horasHombre!=='number') return;
    const key = rep.rosterFecha || '¿?';
    horasConsumidasPorRoster[key] = (horasConsumidasPorRoster[key]||0) + rep.horasHombre;
  });
  const fechasRosters = Array.from(new Set([...Object.keys(rostersMeta||{}).map(k=>rostersMeta[k].fecha), ...Object.keys(horasConsumidasPorRoster)])).sort().reverse();

  if (fechasRosters.length) {
    let filasConsumidas = '', filasDisponibles = '';
    fechasRosters.forEach(fecha=>{
      const meta = Object.values(rostersMeta||{}).find(m=>m.fecha===fecha) || null;
      const consumidas = horasConsumidasPorRoster[fecha] || 0;
      const disponibles = meta ? meta.horasDisponibles : null;
      const sup = meta ? (meta.supervisor||'') : '';
      const apellido = /manzini/i.test(sup) ? 'Manzini' : (/quiroga/i.test(sup) ? 'Quiroga' : (sup || fecha.split('-').reverse().join('/')));
      filasConsumidas += `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12.5px;">

      const pctUso = (disponibles) ? (consumidas/disponibles*100) : null;
      const usoColor = pctUso===null ? 'var(--text2)' : (pctUso<=100 ? '#34C759' : '#FF3B30');
      filasDisponibles += `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12.5px;">
        <span style="color:var(--text2);">Horas disponibles</span>
        <span style="text-align:right;"><strong style="color:var(--text);">${disponibles!==null?disponibles.toLocaleString('es-AR'):'—'} hs</strong>${pctUso!==null?` <span style="color:${usoColor};font-weight:700;">(${pctUso.toFixed(0)}%)</span>`:''}</span>

    html += `<div class="sec-hdr" style="margin:18px 0 12px;">Horas hombre por roster</div>`;
    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
      <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;">

      </div>

  }

  // ---- Evolución mensual: tabla con los 12 meses del año en curso ----
  const mesesEvol = [];
  for (let m=5; m<12; m++) {
    const ref = new Date(TODAY.getFullYear(), m, 1);
    const key = ref.getFullYear() + '-' + String(m+1).padStart(2,'0');
    const esFuturo = (m > TODAY.getMonth());

    const limite = key + '-' + String(dias).padStart(2,'0');

    nombre = nombre.charAt(0).toUpperCase() + nombre.slice(1);
    mesesEvol.push({ key, nombre, esActual, esFuturo, ind: esFuturo ? null : calcIndicadoresMes(key, dias, limite) });
  }

  const fmtCelda = (v, suf, dec) => (v===null||v===undefined) ? '—' : v.toLocaleString('es-AR',{maximumFractionDigits:dec||0})+suf;
  let filas = '';
  mesesEvol.forEach(m=>{
    const i = m.ind;
    filas += `<tr style="border-bottom:1px solid var(--border);${m.esActual?'background:rgba(204,0,0,0.08);':''}">

      <td style="padding:7px 8px;text-align:right;color:var(--text2);">${m.esFuturo?'—':fmtCelda(i.mkbf,' km')}</td>
      <td style="padding:7px 8px;text-align:right;color:var(--text2);">${m.esFuturo?'—':fmtCelda(i.mttrReal!==null?i.mttrReal:HORAS_DETENCION.CORR,' hs',2)}</td>
    </tr>`;
  });

  html += `<div class="sec-hdr" style="margin:18px 0 12px;">Evolución mensual — ${TODAY.getFullYear()}</div>`;
  html += `<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:4px 4px 8px;margin-bottom:8px;overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;font-size:12px;min-width:480px;">
      <thead>
        <tr style="border-bottom:1.5px solid var(--border);">
          <th style="text-align:left;padding:9px 8px;color:var(--text3);font-size:10.5px;letter-spacing:.03em;">MES</th>
          <th style="text-align:right;padding:9px 8px;color:var(--text3);font-size:10.5px;letter-spacing:.03em;">DISPONIB.</th>
          <th style="text-align:right;padding:9px 8px;color:var(--text3);font-size:10.5px;letter-spacing:.03em;">MKBF PROG.</th>
          <th style="text-align:right;padding:9px 8px;color:var(--text3);font-size:10.5px;letter-spacing:.03em;">MKBF CORR.</th>
          <th style="text-align:right;padding:9px 8px;color:var(--text3);font-size:10.5px;letter-spacing:.03em;">MTTR</th>
        </tr>
      </thead>
      <tbody>${filas}</tbody>
    </table>
  </div>
  <div style="font-size:11px;color:var(--text3);margin-bottom:14px;">* Mes en curso, calculado hasta hoy (${diasTranscurridos} días). Los meses futuros todavía no tienen datos.</div>`;

  // ---- Intervenciones por lugar: Sede vs Mina (según las OT importadas) ----
  // Sede = OT hechas en el taller de San Juan (Diego Ares). Mina = OT hechas
  // en mina por Manzini o Quiroga. Entre las dos suman el 100% de las
  // intervenciones del mes. Primero se mira quién intervino (técnico /
  // supervisor de la OT); si no alcanza, se usa el "Sector" de la OT.
  function clasificarLugarOT(o){
    // 1) Nombre del asesor de servicio de la OT: Ares = Sede; Manzini o Quiroga = Mina.
    const asesor = (o.asesor||'').toString().toLowerCase();
    if (/\bares\b/.test(asesor)) return 'sede';
    if (/manzini|quiroga/.test(asesor)) return 'mina';
    // 2) Si el asesor no ayuda, técnico / supervisor de la OT.
    const quien = ((o.tecnico||'')+' '+(o.supervisor||'')).toLowerCase();
    if (/\bares\b/.test(quien)) return 'sede';
    if (/manzini|quiroga/.test(quien)) return 'mina';
    const sec = (o.sector||'').toString().trim().toLowerCase();
    if (sec==='mina') return 'mina';
    if (sec==='sj') return 'sede';
    return null;
  }
  function contarLugarMes(mesKey){
    let sede=0, mina=0, sin=0;
    Object.values(otData||{}).forEach(arr=>(arr||[]).forEach(o=>{
      if(!o.fecha_iso || !o.fecha_iso.startsWith(mesKey)) return;
      if(o.tipo==='Venta') return;
      const l = clasificarLugarOT(o);
      if(l==='sede') sede++; else if(l==='mina') mina++; else sin++;
    }));
    return { sede, mina, sin, total: sede+mina };
  }
  const pctLugar = (n,t) => t>0 ? Math.round(n/t*1000)/10 : null;
  const fmtPct = p => p===null ? '—' : p.toLocaleString('es-AR',{maximumFractionDigits:1})+'%';
  // Barra azul (Sede) / naranja (Mina) con el porcentaje escrito adentro de cada tramo.
  const barraLugar = (pS, pM) => `<div style="display:flex;height:22px;border-radius:8px;overflow:hidden;background:var(--bg);">
    <div style="width:${pS||0}%;background:#0A6EBD;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;">${(pS||0)>=10 ? fmtPct(pS) : ''}</div>
    <div style="width:${pM||0}%;background:#FF9500;display:flex;align-items:center;justify-content:center;color:#1a1a1a;font-size:11px;font-weight:700;">${(pM||0)>=10 ? fmtPct(pM) : ''}</div>
  </div>`;

  const lugActual = contarLugarMes(mesActualKey);
  const lugAnterior = contarLugarMes(mesAnteriorKey);
  const pSedeAct = pctLugar(lugActual.sede, lugActual.total), pMinaAct = pctLugar(lugActual.mina, lugActual.total);
  const pSedeAnt = pctLugar(lugAnterior.sede, lugAnterior.total), pMinaAnt = pctLugar(lugAnterior.mina, lugAnterior.total);

  html += `<div class="sec-hdr" style="margin:18px 0 12px;">Intervenciones: Sede vs Mina</div>`;
  html += `<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;">
    <div style="font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.04em;margin-bottom:10px;">ÓRDENES DE TRABAJO — ${nombreMesDisp}</div>
    ${lugActual.total>0 ? `
    <div style="margin-bottom:12px;">${barraLugar(pSedeAct,pMinaAct)}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div>
        <div style="font-size:11.5px;color:var(--text3);"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#0A6EBD;margin-right:5px;"></span>Sede (taller San Juan)</div>
        <div style="font-size:26px;font-weight:800;color:var(--text);line-height:1.2;">${fmtPct(pSedeAct)}</div>
        <div style="font-size:11.5px;color:var(--text2);">${lugActual.sede} orden${lugActual.sede!==1?'es':''}</div>
      </div>
      <div>
        <div style="font-size:11.5px;color:var(--text3);"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#FF9500;margin-right:5px;"></span>Mina</div>
        <div style="font-size:26px;font-weight:800;color:var(--text);line-height:1.2;">${fmtPct(pMinaAct)}</div>
        <div style="font-size:11.5px;color:var(--text2);">${lugActual.mina} orden${lugActual.mina!==1?'es':''}</div>
      </div>
    </div>` : `<div style="font-size:13px;color:var(--text2);">Todavía no hay órdenes de trabajo cargadas este mes.</div>`}
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text3);margin-bottom:6px;"><span>Mes anterior — ${nombreMesAnt}</span><span>${lugAnterior.total>0 ? lugAnterior.total+' órdenes' : ''}</span></div>
      ${lugAnterior.total>0 ? `${barraLugar(pSedeAnt,pMinaAnt)}
      <div style="font-size:11.5px;color:var(--text2);margin-top:6px;">Sede ${fmtPct(pSedeAnt)} <span style="color:var(--text3);">(${lugAnterior.sede})</span> · Mina ${fmtPct(pMinaAnt)} <span style="color:var(--text3);">(${lugAnterior.mina})</span></div>` : `<div style="font-size:12.5px;color:var(--text2);">Sin órdenes cargadas ese mes.</div>`}
    </div>
    <div style="font-size:10.5px;color:var(--text3);margin-top:8px;">Se clasifica por el nombre: Sede = OT de Diego Ares; Mina = OT de Manzini o Quiroga (se mira el asesor de servicio y, si no figura, el técnico o supervisor; como último recurso, el sector). Entre las dos suman el 100% de las intervenciones.${lugActual.sin>0 ? ` ${lugActual.sin} orden${lugActual.sin!==1?'es':''} de este mes sin poder clasificar (no figura técnico ni sector).` : ''}</div>
  </div>`;

  let filasLugar = '';
  mesesEvol.forEach(m=>{
    if (m.esFuturo) { filasLugar += `<tr style="border-bottom:1px solid var(--border);"><td style="padding:7px 8px;color:var(--text);">${m.nombre}</td><td style="padding:7px 8px;text-align:right;color:var(--text2);">—</td><td style="padding:7px 8px;text-align:right;color:var(--text2);">—</td><td style="padding:7px 8px;text-align:right;color:var(--text2);">—</td></tr>`; return; }
    const c = contarLugarMes(m.key);
    const ps = pctLugar(c.sede,c.total), pm = pctLugar(c.mina,c.total);
    filasLugar += `<tr style="border-bottom:1px solid var(--border);${m.esActual?'background:rgba(204,0,0,0.08);':''}">
      <td style="padding:7px 8px;font-weight:${m.esActual?'700':'500'};color:var(--text);white-space:nowrap;">${m.nombre}${m.esActual?' *':''}</td>
      <td style="padding:7px 8px;text-align:right;color:var(--text2);">${c.total>0 ? fmtPct(ps)+' <span style="color:var(--text3);">('+c.sede+')</span>' : '—'}</td>
      <td style="padding:7px 8px;text-align:right;color:var(--text2);">${c.total>0 ? fmtPct(pm)+' <span style="color:var(--text3);">('+c.mina+')</span>' : '—'}</td>
      <td style="padding:7px 8px;text-align:right;color:var(--text2);">${c.total>0 ? c.total : '—'}</td>
    </tr>`;
  });
  html += `<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:4px 4px 8px;margin-bottom:14px;overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;font-size:12px;min-width:360px;">
      <thead>
        <tr style="border-bottom:1.5px solid var(--border);">
          <th style="text-align:left;padding:9px 8px;color:var(--text3);font-size:10.5px;letter-spacing:.03em;">MES</th>
          <th style="text-align:right;padding:9px 8px;color:var(--text3);font-size:10.5px;letter-spacing:.03em;">SEDE</th>
          <th style="text-align:right;padding:9px 8px;color:var(--text3);font-size:10.5px;letter-spacing:.03em;">MINA</th>
          <th style="text-align:right;padding:9px 8px;color:var(--text3);font-size:10.5px;letter-spacing:.03em;">TOTAL OT</th>
        </tr>
      </thead>
      <tbody>${filasLugar}</tbody>
    </table>
  </div>`;

  // ---- Intervenciones por categoría (códigos 00 al 10, suman 100%) ----
  // 00 = mantenimiento (PM y chequeos mensuales) hecho en mina  -> sale de los rosters.
  // 01 = mantenimiento hecho en San Juan                         -> sale de las OT de Sede (tipo PM).
  // 02 al 10 = reparaciones por sistema: las de mina salen de los rosters y las de
  // Sede de las OT correctivas de Sede. Las OT de mina no se cuentan acá para no
  // duplicar lo que ya está en los rosters.
  const SISTEMAS_REP = [
    {cod:'02', nombre:'MOTOR', re:/turbo|inyect|sensor map|baja potencia|potencia|refriger|radiador|combustible|dpf|escape|distribuc|correa|bujia|calentad|\bmotor\b/,
      subs:[ {nombre:'Turbo', re:/turbo|geometria/}, {nombre:'Combustible / inyección', re:/inyect|combustible/}, {nombre:'Refrigeración', re:/refriger|radiador|calentad/},
             {nombre:'Potencia / sensor MAP', re:/potencia|sensor map/}, {nombre:'DPF / escape', re:/dpf|escape/}, {nombre:'Distribución / correas', re:/distribuc|correa|bujia/} ]},
    {cod:'03', nombre:'EMBRAGUE', re:/embrague|clutch/},
    {cod:'04', nombre:'CAJA DE CAMBIOS', re:/caja de cambio|caja de velocidad|caja automatica/},
    {cod:'05', nombre:'TRANSMISION', re:/transmision|cardan|diferencial|\bdoble\b|semi ?eje|palier|traccion|4x4|reductora|transfer/,
      subs:[ {nombre:'Semiejes y palier', re:/semi ?eje|palier/}, {nombre:'Doble tracción / 4x4', re:/\bdoble\b|4x4|traccion|reductora|transfer/}, {nombre:'Cardán / diferencial', re:/cardan|diferencial/} ]},
    {cod:'06', nombre:'EJE DELANTERO /DIRECCION /CUBOS/RUEDAS', re:/direccion|eje delantero|cubo|rueda|neumatic|cubierta|rulem|rodamiento|\bbba\b|cremallera|rotula|alineacion|balanceo/,
      subs:[ {nombre:'Dirección', re:/direccion|cremallera|\bbba\b|rotula/}, {nombre:'Cubos y rodamientos', re:/cubo|rulem|rodamiento/}, {nombre:'Ruedas y neumáticos', re:/rueda|neumatic|cubierta|oruga/},
             {nombre:'Alineación y balanceo', re:/alineacion|balanceo/}, {nombre:'Eje delantero', re:/eje delantero/} ]},
    {cod:'07', nombre:'FRENO', re:/freno|pastilla|zapata|campana|pinza/,
      subs:[ {nombre:'Pastillas, zapatas y campanas', re:/pastilla|zapata|campana|pinza/}, {nombre:'Líquido de freno', re:/liquid\w*\s+(de\s+)?freno/}, {nombre:'Sistema de frenos (general)', re:/freno/} ]},
    {cod:'08', nombre:'SUSPENSION', re:/suspension|amortigua|elastic|resorte|estabiliz|\bbuje|fuelle|descongel/,
      subs:[ {nombre:'Amortiguadores', re:/amortigua/}, {nombre:'Elásticos y resortes', re:/elastic|resorte/}, {nombre:'Barra estabilizadora', re:/estabiliz/},
             {nombre:'Bujes y fuelles', re:/\bbuje|fuelle/}, {nombre:'Descongelamiento', re:/descongel/}, {nombre:'Suspensión (general)', re:/suspension/} ]},
    {cod:'09', nombre:'SISTEMA ELECTRICO', re:/electric|bateria|alternador|arranque|fusible|\bluz\b|luces|lampara|sensor|tablero|alarma|escaner|cableado|\bcable|faro/,
      subs:[ {nombre:'Batería', re:/bateria/}, {nombre:'Luces y lámparas', re:/\bluz\b|luces|lampara|\blamp\b|faro/}, {nombre:'Fusibles y cableado', re:/fusible|cableado|\bcable/},
             {nombre:'Alarma / tablero / escáner', re:/alarma|tablero|escaner|sensor/}, {nombre:'Arranque y alternador', re:/arranque|alternador/}, {nombre:'Eléctrico (general)', re:/electric/} ]},
    {cod:'10', nombre:'CABINA', re:/cabina|asiento|funda|tapizad|parabrisas|lavaparab|escobilla|vidrio|espejo|retrovisor|puerta|cerradura|climatiz|calefaccion|anti[\s-]?e[xs]plosiv/,
      subs:[ {nombre:'Film antiexplosivo', re:/anti[\s-]?e[xs]plosiv/}, {nombre:'Escobillas y lavaparabrisas', re:/escobilla|parabrisas|lavaparab/}, {nombre:'Vidrios y espejos', re:/vidrio|espejo|retrovisor/}, {nombre:'Asientos y fundas', re:/asiento|funda|tapizad/},
             {nombre:'Puertas y cerraduras', re:/puerta|cerradura/}, {nombre:'Climatización', re:/climatiz|calefaccion/}, {nombre:'Cabina (general)', re:/cabina/} ]},
    {cod:'11', nombre:'LAVADO COMPLETO', re:/lavado\s+completo/},
    {cod:'12', nombre:'CAMBIO DE PERTIGA', re:/pertiga/}
  ];
  const CATEGORIAS_INT = [
    {cod:'00', nombre:'MANTENIMIENTO MINA', subs:[ {nombre:'PM', re:/^pm/}, {nombre:'Chequeo mensual', re:/chequeo mensual/} ]},
    {cod:'01', nombre:'MANTENIMIENTO SAN JUAN'},
    ...SISTEMAS_REP
  ];
  const sinAcentos = s => (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const esRepProgramada = t => { const u = sinAcentos(t).trim(); return u==='pm' || /chequeo mensual/.test(u); };
  function sistemaDeTextos(campos){
    // Se mira todo el texto de la intervención en este orden: 1) reparación de un sistema (02 al 10),
    // 2) cambio de pértiga, 3) lavado completo. Así una orden que trae un embrague (por ejemplo)
    // y además un lavado cuenta como embrague, y el lavado/pértiga solo cuentan si no hay otra reparación.
    const ts = campos.map(sinAcentos).filter(Boolean);
    const REPARACION = SISTEMAS_REP.filter(x=>x.cod!=='11' && x.cod!=='12');
    for (const t of ts) for (const x of REPARACION) if (x.re.test(t)) return x.cod;
    for (const t of ts) if (/pertiga/.test(t)) return '12';
    for (const t of ts) if (/lavado\s+completo/.test(t)) return '11';
    return null;
  }
  // Subcategoría dentro de una categoría: la primera que coincide con el texto; si ninguna, "Otros".
  function subDeCategoria(cod, campos){
    const cat = CATEGORIAS_INT.find(c=>c.cod===cod);
    if (!cat || !cat.subs) return null;
    for (const c of campos) {
      const t = sinAcentos(c);
      if (!t) continue;
      for (const sb of cat.subs) if (sb.re.test(t)) return sb.nombre;
    }
    return 'Otros';
  }

  function contarCategoriasMes(mesKey){
    const cnt = {}; CATEGORIAS_INT.forEach(c=>cnt[c.cod]=0); cnt.otros = 0;
    let total = 0;
    const detOtros = [];
    const sub = {}; // sub[cod][nombre] = cantidad
    const addSub = (cod, campos) => { const n = subDeCategoria(cod, campos); if (n) { (sub[cod] = sub[cod] || {})[n] = (sub[cod][n]||0) + 1; } };
    // Mina: rosters
    Object.values(reparacionesReales||{}).forEach(rep=>{
      if (!rep.fecha || !rep.fecha.startsWith(mesKey)) return;
      if (esRepProgramada(rep.tipo)) { cnt['00']++; addSub('00',[rep.tipo]); total++; return; }
      const cod = sistemaDeTextos([rep.tipo, rep.causa]);
      if (cod) { cnt[cod]++; addSub(cod,[rep.tipo, rep.causa]); } else {
        cnt.otros++;
        detOtros.push({ fecha: rep.fecha, patente: rep.patente||'', origen: 'Roster (mina)', texto: [rep.tipo, rep.causa].filter(Boolean).join(' — ') });
      }
      total++;
    });
    // San Juan: OT de Sede
    Object.values(otData||{}).forEach(arr=>(arr||[]).forEach(o=>{
      if (!o.fecha_iso || !o.fecha_iso.startsWith(mesKey)) return;
      if (o.tipo==='Venta') return;
      if (clasificarLugarOT(o)!=='sede') return;
      if (o.tipo==='PM') { cnt['01']++; total++; return; }
      const cod = sistemaDeTextos([...(o.trabajos||[]).map(t=>t.desc), ...(o.repuestos||[]).map(r=>r.desc)]);
      if (cod) { cnt[cod]++; addSub(cod,[...(o.trabajos||[]).map(t=>t.desc), ...(o.repuestos||[]).map(r=>r.desc)]); } else {
        cnt.otros++;
        const txt = [...(o.trabajos||[]).map(t=>t.desc), ...(o.repuestos||[]).map(r=>r.desc)].filter(Boolean).join('; ');
        detOtros.push({ fecha: o.fecha_iso, patente: o.patente||'', origen: 'OT Sede' + (o.nro ? ' N° '+o.nro : ''), texto: txt });
      }
      total++;
    }));
    return { cnt, total, detOtros, sub };
  }

  html += `<div class="sec-hdr" style="margin:18px 0 12px;">Intervenciones por categoría</div>`;
  const colsSis = mesesEvol.filter(m=>!m.esFuturo).map(m=>({ m, r: contarCategoriasMes(m.key) })).filter(x=>x.r.total>0);
  if (!colsSis.length) {
    html += `<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px;font-size:13px;color:var(--text2);">Todavía no hay intervenciones cargadas (rosters u órdenes de trabajo).</div>`;
  } else {
    const totalGlobal = colsSis.reduce((s,x)=>s+x.r.total,0);
    const sumaCod = cod => colsSis.reduce((s,x)=>s+x.r.cnt[cod],0);
    const celdaSis = (n,t) => (t>0 && n>0) ? `${(n/t*100).toLocaleString('es-AR',{maximumFractionDigits:1})}% <span style="color:var(--text3);">(${n})</span>` : '—';
    let filasSis = '';
    CATEGORIAS_INT.forEach(s=>{
      // subcategorías con datos en algún mes
      const nombresSub = [];
      (s.subs||[]).forEach(sb=>{ if (colsSis.some(x=>((x.r.sub[s.cod]||{})[sb.nombre]||0)>0)) nombresSub.push(sb.nombre); });
      if (colsSis.some(x=>((x.r.sub[s.cod]||{})['Otros']||0)>0)) nombresSub.push('Otros');
      const expandible = nombresSub.length>0 && sumaCod(s.cod)>0;
      const abierta = !!subcatAbiertas[s.cod];
      filasSis += `<tr style="border-bottom:1px solid var(--border);${expandible?'cursor:pointer;':''}" ${expandible?`onclick="toggleSubcat('${s.cod}')"`:''}>
        <td style="padding:7px 8px;color:var(--text);font-size:11.5px;"><span id="caret-${s.cod}" style="display:inline-block;width:14px;color:var(--text3);">${expandible ? (abierta?'▾':'▸') : ''}</span>${s.cod}-${s.nombre}</td>
        ${colsSis.map(x=>`<td style="padding:7px 8px;text-align:right;color:var(--text2);white-space:nowrap;">${celdaSis(x.r.cnt[s.cod], x.r.total)}</td>`).join('')}
        <td style="padding:7px 8px;text-align:right;color:var(--text);font-weight:700;white-space:nowrap;">${celdaSis(sumaCod(s.cod), totalGlobal)}</td>
      </tr>`;
      if (expandible) nombresSub.forEach(nom=>{
        const totSub = colsSis.reduce((a,x)=>a+(((x.r.sub[s.cod]||{})[nom])||0),0);
        filasSis += `<tr data-parent="${s.cod}" style="border-bottom:1px solid var(--border);background:rgba(255,255,255,0.03);${abierta?'':'display:none;'}">
          <td style="padding:6px 8px 6px 34px;color:var(--text2);font-size:11px;">${nom}</td>
          ${colsSis.map(x=>`<td style="padding:6px 8px;text-align:right;color:var(--text3);font-size:11px;white-space:nowrap;">${celdaSis(((x.r.sub[s.cod]||{})[nom])||0, x.r.total)}</td>`).join('')}
          <td style="padding:6px 8px;text-align:right;color:var(--text2);font-size:11px;white-space:nowrap;">${celdaSis(totSub, totalGlobal)}</td>
        </tr>`;
      });
    });
    filasSis += `<tr style="border-bottom:1px solid var(--border);">
      <td style="padding:7px 8px;color:var(--text3);font-size:11.5px;">Sin clasificar</td>
      ${colsSis.map(x=>`<td style="padding:7px 8px;text-align:right;color:var(--text3);white-space:nowrap;">${celdaSis(x.r.cnt.otros, x.r.total)}</td>`).join('')}
      <td style="padding:7px 8px;text-align:right;color:var(--text3);font-weight:700;white-space:nowrap;">${celdaSis(sumaCod('otros'), totalGlobal)}</td>
    </tr>
    <tr>
      <td style="padding:8px;color:var(--text);font-weight:700;font-size:11.5px;">Total intervenciones</td>
      ${colsSis.map(x=>`<td style="padding:8px;text-align:right;color:var(--text);font-weight:700;">${x.r.total}</td>`).join('')}
      <td style="padding:8px;text-align:right;color:var(--text);font-weight:700;">${totalGlobal}</td>
    </tr>`;
    html += `<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:4px 4px 8px;margin-bottom:8px;overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:12px;min-width:${300 + colsSis.length*80}px;">
        <thead>
          <tr style="border-bottom:1.5px solid var(--border);">
            <th style="text-align:left;padding:9px 8px;color:var(--text3);font-size:10.5px;letter-spacing:.03em;">CATEGORÍA</th>
            ${colsSis.map(x=>`<th style="text-align:right;padding:9px 8px;color:var(--text3);font-size:10.5px;letter-spacing:.03em;">${x.m.nombre.toUpperCase()}</th>`).join('')}
            <th style="text-align:right;padding:9px 8px;color:var(--text3);font-size:10.5px;letter-spacing:.03em;">TOTAL</th>
          </tr>
        </thead>
        <tbody>${filasSis}</tbody>
      </table>
    </div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:14px;">Porcentaje sobre las intervenciones del mes, con la cantidad entre paréntesis; cada columna suma 100%. 00 = PM y chequeos mensuales en mina (rosters). 01 = PM en San Juan (OT de Sede). 02 al 10 = reparaciones por sistema, 11 = lavado completo y 12 = cambio de pértiga (estos dos cuentan solo cuando la intervención no incluye la reparación de otro sistema), clasificados automáticamente según lo que dice cada intervención. Tocá una categoría con ▸ para ver sus subcategorías.</div>`;

    const escH = t => String(t==null?'':t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const listaOtros = colsSis.flatMap(x=>x.r.detOtros).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
    if (listaOtros.length) {
      html += `<details style="margin-bottom:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 14px;">
        <summary style="cursor:pointer;font-size:12.5px;font-weight:700;color:var(--text2);">Ver las ${listaOtros.length} intervenciones sin clasificar</summary>
        <div style="max-height:340px;overflow-y:auto;margin-top:8px;">${listaOtros.map(d=>`<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text2);line-height:1.4;">
          <strong style="color:var(--text);">${d.fecha ? d.fecha.split('-').reverse().join('/') : '—'}</strong> · ${escH(d.patente)} · <span style="color:var(--text3);">${escH(d.origen)}</span><br>${d.texto ? escH(d.texto.length>220 ? d.texto.slice(0,220)+'…' : d.texto) : '<em style="color:var(--text3);">(sin descripción de trabajos ni repuestos)</em>'}
        </div>`).join('')}</div></details>`;
    }
  }

  // Foto del Dashboard para el informe completo (ver informeCompletoBloques): guarda los mismos
  // cálculos que se ven en pantalla para que el informe dé exactamente los mismos números.
  window.__dash = { calcIndicadoresMes, contarLugarMes, contarCategoriasMes, clasificarLugarOT, sistemaDeTextos, subDeCategoria,
                    CATEGORIAS_INT, mesesEvol, mesActualKey, mttrFijo: HORAS_DETENCION.CORR };

  html += kpiContratoHTML(window.__dash);

  html += `<div class="sec-hdr" style="margin:2px 0 12px;">Resumen de flota</div>`;
  if (!soloLectura()) html += `<button onclick="openInformeEjecutivo()" style="width:100%;padding:13px;border-radius:12px;background:var(--red);color:#fff;border:none;font-weight:700;font-size:14px;margin-bottom:14px;">📄 Generar informe ejecutivo (PDF / Word)</button>`;
  if (!soloLectura()) html += `<button onclick="openInformeCompleto()" style="width:100%;padding:13px;border-radius:12px;background:var(--card);color:var(--text);border:1.5px solid var(--red);font-weight:700;font-size:14px;margin-bottom:14px;">📊 Informe completo de indicadores (PDF / Word)</button>`;
  if (!soloLectura()) html += `<button onclick="generarPlanillaKPI()" style="width:100%;padding:13px;border-radius:12px;background:var(--card);color:var(--text);border:1.5px solid var(--border);font-weight:700;font-size:14px;margin-bottom:14px;">📈 Planilla de KPI del contrato (Excel)</button>`;

  // Fila: Estado de turnos + Tipos de PM
  html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">`;

  // Estado de turnos
  const dot=(color,label,val)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;"><span style="width:11px;height:11px;border-radius:50%;background:${color};flex:none;"></span><span style="font-size:13px;color:var(--text2);">${label}</span><span style="margin-left:auto;font-weight:700;font-size:14px;">${val}</span></div>`;
  html += `<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;">
    <div style="font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.04em;margin-bottom:12px;">ESTADO DE TURNOS</div>
    ${dot('#34C759','Pendientes',pend)}
    ${dot('#FF9500','Próx. límite',prox)}
    ${dot('#FF3B30','Vencidos',venc)}
    ${dot('#5856D6','Correctivos',corr)}
    ${dot('#0A6EBD','Cumplidos',cumpl)}
  </div>`;

  // Tipos de PM
  const pmBar=(label,val,color)=>`<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:3px;"><span>${label}</span><span style="font-weight:700;color:var(--text);">${val}</span></div><div style="background:var(--border);border-radius:5px;height:7px;overflow:hidden;"><div style="width:${Math.max(4,val/maxTipo*100)}%;height:100%;background:${color};border-radius:5px;"></div></div></div>`;
  html += `<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;">
    <div style="font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.04em;margin-bottom:12px;">TIPOS DE PM</div>
    ${pmBar('PM 5.000 km',tipo.PM5,'#34C759')}
    ${pmBar('Correctivo',tipo.CORR,'#5856D6')}
    ${pmBar('Predictivo',tipo.PRED,'#00BCD4')}
  </div>`;
  html += `</div>`;

  // Turnos por área
  html += `<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;">
    <div style="font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.04em;margin-bottom:12px;">TURNOS POR ÁREA</div>`;
  if(areaArr.length){
    areaArr.forEach(([a,v])=>{
      html += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <span style="font-size:12px;color:var(--text2);width:96px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${a}</span>
        <div style="flex:1;background:var(--border);border-radius:5px;height:8px;overflow:hidden;"><div style="width:${Math.max(4,v/maxArea*100)}%;height:100%;background:#2E7CF6;border-radius:5px;"></div></div>
        <span style="font-weight:700;font-size:13px;width:22px;text-align:right;">${v}</span>
      </div>`;
    });
  } else {
    html += `<div style="font-size:12px;color:var(--text3);">Sin turnos cargados aún.</div>`;
  }
  html += `</div>`;

  // Resumen de OT (Vicuña)
  html += `<div class="sec-hdr" style="margin:18px 0 12px;">Órdenes de trabajo</div>`;
  html += `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;">
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;"><div style="font-size:22px;font-weight:800;">${otAll.length}</div><div style="font-size:11px;color:var(--text3);margin-top:2px;">OT cargadas</div></div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;"><div style="font-size:22px;font-weight:800;">${nUnid}</div><div style="font-size:11px;color:var(--text3);margin-top:2px;">Unidades</div></div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;"><div style="font-size:22px;font-weight:800;">${repTotal}</div><div style="font-size:11px;color:var(--text3);margin-top:2px;">Repuestos</div></div>
  </div>`;
  html += `<div style="background:linear-gradient(135deg,#CC0000,#990000);border-radius:14px;padding:16px;margin-bottom:12px;color:#fff;">
    <div style="font-size:12px;opacity:.85;letter-spacing:.04em;">COSTO TOTAL DE MANTENIMIENTO</div>
    <div style="font-size:28px;font-weight:800;margin-top:4px;">USD ${costoTotal.toLocaleString('es-AR',{maximumFractionDigits:0})}</div>
    <div style="font-size:11px;opacity:.75;margin-top:2px;">Acumulado de todas las OT importadas</div>
  </div>`;

  // Alertas de mantenimiento
  html += `<div class="sec-hdr" style="margin:18px 0 12px;">⚠️ Alertas de mantenimiento</div>`;
  if(alertas.length){
    alertas.forEach(e=>{
      const pm=PMS[e.pm]; const eDate=new Date(e.fecha+'T12:00:00');
      const vencido = eDate<NOW_DAY;
      const badge = vencido ? '<span style="background:#FFE5E5;color:#CC0000;font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;">Vencido</span>'
                            : '<span style="background:#FFF5E0;color:#B86800;font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;">Próximo</span>';
      html += `<div style="background:${vencido?'#FFF5F5':'#FFFBF0'};border:1px solid ${vencido?'#FFD5D5':'#FFE8C0'};border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;">
        <span style="width:14px;height:14px;border-radius:50%;background:${vencido?'#FF3B30':'#FF9500'};flex:none;"></span>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:14px;color:#1a1a1a;">${e.dom||''} <span style="font-weight:400;color:#888;font-size:12px;">${e.vehiculo||''}</span></div>
          <div style="font-size:12px;color:#666;margin-top:2px;">${pm?pm.short:''} · ${e.area||''}${e.tec?(' · '+e.tec):''}</div>
        </div>
        ${badge}
      </div>`;
    });
  } else {
    html += `<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;color:var(--text3);">✅ Sin alertas pendientes — todo al día.</div>`;
  }

  html += `</div>`;
  c.innerHTML = html;
}

/* ---------- Recolectar todos los datos de la app ---------- */
function informeDatos(){
  const evs = Array.isArray(events) ? events : [];
  const ot = {}; if(typeof otData!=='undefined' && otData) Object.assign(ot, otData);
  const otAll=[]; Object.values(ot).forEach(arr=>arr.forEach(o=>otAll.push(o)));

  // Resumen
  const nUnid = Object.keys(ot).length;
  let costoTotal=0, repTotal=0, pmCount=0, corrCount=0;
  otAll.forEach(o=>{ costoTotal+=(o.total_usd||0); repTotal+=(o.repuestos||[]).length;
    if(o.tipo==='PM') pmCount++; else if(o.tipo==='Correctivo') corrCount++; });

  // Repuestos más consumidos
  const repCnt={}, repUsd={};
  otAll.forEach(o=>(o.repuestos||[]).forEach(r=>{ repCnt[r.desc]=(repCnt[r.desc]||0)+r.cant; repUsd[r.desc]=(repUsd[r.desc]||0)+(r.usd||0); }));
  const topRep = Object.entries(repCnt).map(([d,c])=>({desc:d,cant:c,usd:repUsd[d]||0})).sort((a,b)=>b.cant-a.cant).slice(0,15);

  // Ranking unidades por gasto
  const uniUsd={}, uniInt={};
  Object.entries(ot).forEach(([p,arr])=>{ uniUsd[p]=arr.reduce((s,o)=>s+(o.total_usd||0),0); uniInt[p]=arr.length; });
  const ranking = Object.keys(uniUsd).map(p=>({patente:p,usd:uniUsd[p],int:uniInt[p]})).sort((a,b)=>b.usd-a.usd);

  // Costo por período
  const mesUsd={};
  otAll.forEach(o=>{ if(o.fecha_iso){ const m=o.fecha_iso.slice(0,7); mesUsd[m]=(mesUsd[m]||0)+(o.total_usd||0); } });
  const periodos = Object.entries(mesUsd).sort().map(([m,v])=>({mes:m,usd:v}));

  // Turnos por área
  const areas={}; evs.forEach(e=>{ const a=e.area||'Sin área'; areas[a]=(areas[a]||0)+1; });
  const areaArr = Object.entries(areas).sort((a,b)=>b[1]-a[1]);

  return { ot, otAll, nUnid, costoTotal, repTotal, pmCount, corrCount, topRep, ranking, periodos, areaArr,
           fecha: new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'}) };
}

function fmtUSD(n){ return 'USD '+(n||0).toLocaleString('es-AR',{maximumFractionDigits:0}); }

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <span style="font-size:17px;font-weight:700;">📄 Informe ejecutivo</span>
        <button onclick="document.getElementById('infEjecModal').remove()" style="background:none;border:none;font-size:22px;color:var(--text2);">✕</button>
      </div>
      <p style="font-size:13px;color:var(--text2);margin:0 0 16px;">Genera un informe profesional con portada, resumen ejecutivo, indicadores de flota, análisis de consumo y el detalle completo de cada unidad.</p>
      <button onclick="generarInformePDF()" style="width:100%;padding:14px;border-radius:12px;background:var(--red);color:#fff;border:none;font-weight:700;font-size:15px;margin-bottom:10px;">📕 Descargar PDF</button>
      <button onclick="generarInformeWord()" style="width:100%;padding:14px;border-radius:12px;background:var(--card);color:var(--text);border:1.5px solid var(--border);font-weight:700;font-size:15px;">📘 Descargar Word</button>
      <div id="infEjecStatus" style="font-size:12px;color:var(--text3);text-align:center;margin-top:12px;"></div>
    </div>`;
  document.body.appendChild(modal);
}

/* ---------- PDF ---------- */
function generarInformePDF(){
  const st=document.getElementById('infEjecStatus'); if(st) st.textContent='Generando PDF…';
  try {
    const D = informeDatos();
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'mm',format:'a4'});
    const W = 210, M = 16;
    let y = 0;

    // ---- Portada ----
    // logo
    try { doc.addImage(FREDDY_LOGO, 'PNG', M, 20, 80, 33); } catch(e){}
    y = 66;
    doc.setDrawColor(204,0,0); doc.setLineWidth(1); doc.line(M, y, W-M, y); y+=14;
    doc.setFont('helvetica','bold'); doc.setFontSize(22); doc.setTextColor(30,30,30);
    doc.text('Informe de Mantenimiento de Flota', M, y); y+=10;
    doc.setFontSize(15); doc.setTextColor(204,0,0);
    doc.text('Proyecto Vicuña', M, y); y+=16;
    doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(90,90,90);
    doc.text('Freddy El Taller S.R.L. — Mantenimiento de livianos', M, y); y+=6;
    doc.text('Servicio prestado a: Vicuña Argentina S.A.', M, y); y+=6;
    doc.text('Fecha de emisión: '+D.fecha, M, y); y+=20;

    // ---- Resumen ejecutivo (tarjetas) ----
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(30,30,30);
    doc.text('Resumen ejecutivo', M, y); y+=8;
    const cards = [
      ['Unidades intervenidas', String(D.nUnid)],
      ['Órdenes de trabajo', String(D.otAll.length)],
      ['Repuestos utilizados', String(D.repTotal)],
      ['Costo total (USD)', D.costoTotal.toLocaleString('es-AR',{maximumFractionDigits:0})],
      ['Servicios PM', String(D.pmCount)],
      ['Correctivos', String(D.corrCount)]
    ];
    const cw=(W-2*M-2*6)/3, ch=22; let cx=M, cy=y;
    cards.forEach((c,i)=>{
      const col=i%3, row=Math.floor(i/3);
      cx = M + col*(cw+6); cy = y + row*(ch+6);
      doc.setFillColor(247,247,249); doc.setDrawColor(225,225,228);
      doc.roundedRect(cx, cy, cw, ch, 2, 2, 'FD');
      doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(204,0,0);
      doc.text(c[1], cx+cw/2, cy+10, {align:'center'});
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(100,100,100);
      doc.text(c[0], cx+cw/2, cy+17, {align:'center'});
    });
    y = cy + ch + 14;

    // ---- Turnos por área ----
    if(D.areaArr.length){
      doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(30,30,30);
      doc.text('Turnos por área', M, y); y+=2;
      doc.autoTable({ startY:y+2, margin:{left:M,right:M},
        head:[['Área','Turnos']], body:D.areaArr.map(([a,n])=>[a,String(n)]),
        theme:'striped', headStyles:{fillColor:[204,0,0],fontSize:9}, bodyStyles:{fontSize:9},
        columnStyles:{1:{halign:'right',cellWidth:30}} });
      y = doc.lastAutoTable.finalY + 12;
    }

    // ---- Repuestos más consumidos ----
    doc.addPage(); y=M+4;
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(30,30,30);
    doc.text('Análisis de consumo', M, y); y+=8;
    doc.setFontSize(11); doc.text('Repuestos más consumidos', M, y);
    doc.autoTable({ startY:y+2, margin:{left:M,right:M},
      head:[['Repuesto','Cantidad','Costo USD']],
      body:D.topRep.map(r=>[r.desc, String(r.cant), r.usd.toLocaleString('es-AR',{maximumFractionDigits:0})]),
      theme:'striped', headStyles:{fillColor:[204,0,0],fontSize:9}, bodyStyles:{fontSize:8.5},
      columnStyles:{1:{halign:'right',cellWidth:24},2:{halign:'right',cellWidth:28}} });
    y = doc.lastAutoTable.finalY + 10;

    // ---- Ranking de unidades ----
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(30,30,30);
    doc.text('Ranking de unidades por gasto', M, y);
    doc.autoTable({ startY:y+2, margin:{left:M,right:M},
      head:[['Patente','Intervenciones','Costo USD']],
      body:D.ranking.map(r=>[r.patente, String(r.int), r.usd.toLocaleString('es-AR',{maximumFractionDigits:0})]),
      theme:'striped', headStyles:{fillColor:[204,0,0],fontSize:9}, bodyStyles:{fontSize:8.5},
      columnStyles:{1:{halign:'right',cellWidth:34},2:{halign:'right',cellWidth:30}} });

    // ---- Costo por período ----
    if(D.periodos.length){
      y = doc.lastAutoTable.finalY + 10;
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(30,30,30);
      doc.text('Costo por período', M, y);
      doc.autoTable({ startY:y+2, margin:{left:M,right:M},
        head:[['Período','Costo USD']],
        body:D.periodos.map(p=>{ const d=new Date(p.mes+'-01T12:00:00'); return [d.toLocaleDateString('es-AR',{month:'long',year:'numeric'}), p.usd.toLocaleString('es-AR',{maximumFractionDigits:0})]; }),
        theme:'striped', headStyles:{fillColor:[204,0,0],fontSize:9}, bodyStyles:{fontSize:9},
        columnStyles:{1:{halign:'right',cellWidth:40}} });
    }

    // ---- Detalle por unidad ----
    doc.addPage(); y=M+4;
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(30,30,30);
    doc.text('Detalle por unidad', M, y); y+=8;
    Object.keys(D.ot).sort().forEach(pat=>{
      const arr = D.ot[pat].slice().sort((a,b)=>(a.km_efectivo||0)-(b.km_efectivo||0));
      if(y > 250){ doc.addPage(); y=M+4; }
      doc.setFillColor(204,0,0); doc.roundedRect(M, y, W-2*M, 8, 1,1,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(255,255,255);
      doc.text(pat+'  ·  '+(arr[0]?.modelo||''), M+3, y+5.5); y+=12;
      arr.forEach(o=>{
        const body = [];
        (o.repuestos||[]).forEach(r=> body.push([r.cant+'× '+r.desc, r.usd? ('USD '+r.usd.toLocaleString('es-AR',{maximumFractionDigits:0})):'']));
        (o.trabajos||[]).forEach(t=> body.push(['(MO) '+t.desc, t.usd? ('USD '+t.usd.toLocaleString('es-AR',{maximumFractionDigits:0})):'']));
        doc.autoTable({ startY:y, margin:{left:M,right:M},
          head:[[`OT ${o.nro||''} · ${o.fecha||''} · ${(o.km_efectivo||0).toLocaleString('es-AR')} km · ${o.tipo||''}`, fmtUSD(o.total_usd)]],
          body: body.length?body:[['Sin ítems detallados','']],
          theme:'grid', headStyles:{fillColor:[70,70,70],fontSize:8.5,textColor:[255,255,255]}, bodyStyles:{fontSize:8},
          columnStyles:{1:{halign:'right',cellWidth:32}} });
        y = doc.lastAutoTable.finalY + 4;
        if(y > 265){ doc.addPage(); y=M+4; }
      });
      y += 4;
    });

    // ---- Pie de página en todas ----
    const pages = doc.internal.getNumberOfPages();
    for(let i=1;i<=pages;i++){ doc.setPage(i);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(150,150,150);
      doc.text('Freddy El Taller S.R.L. — Informe de Mantenimiento Proyecto Vicuña', M, 290);
      doc.text('Página '+i+' de '+pages, W-M, 290, {align:'right'});
    }

    doc.save('Informe_Mantenimiento_Vicuna_'+new Date().toISOString().slice(0,10)+'.pdf');
    if(st) st.textContent='✅ PDF generado.';
  } catch(e){ console.error(e); if(st) st.textContent='Error al generar PDF: '+e.message; }
}

/* ---------- Word (docx) ---------- */
function generarInformeWord(){
  const st=document.getElementById('infEjecStatus'); if(st) st.textContent='Generando Word…';
  try {
    const D = informeDatos();
    const dx = window.docx;
    const { Document, Packer, Paragraph, TextRun, HeadingLevel, Table, TableRow, TableCell, WidthType, AlignmentType, BorderStyle, ImageRun, ShadingType } = dx;

    const RED = 'CC0000', GRAY='464646';
    const P = (text, opts={}) => new Paragraph({ children:[new TextRun({text, bold:opts.bold, size:opts.size||22, color:opts.color, italics:opts.it})], spacing:{after:opts.after!==undefined?opts.after:100}, alignment:opts.align });
    const H = (text) => new Paragraph({ children:[new TextRun({text, bold:true, size:28, color:RED})], spacing:{before:240, after:120} });

    // celda
    const cell = (text, opts={}) => new TableCell({
      width:{size:opts.w||33, type:WidthType.PERCENTAGE},
      shading: opts.head?{fill:RED, type:ShadingType.CLEAR, color:'auto'}:(opts.dark?{fill:GRAY,type:ShadingType.CLEAR,color:'auto'}:undefined),
      children:[new Paragraph({ children:[new TextRun({text:String(text), bold:opts.head||opts.dark, color:(opts.head||opts.dark)?'FFFFFF':undefined, size:opts.size||18})], alignment:opts.align })]
    });
    const tbl = (headRow, bodyRows) => new Table({ width:{size:100,type:WidthType.PERCENTAGE}, rows:[
      new TableRow({children:headRow, tableHeader:true}), ...bodyRows ] });

    const children = [];

    // ---- Logo + portada ----
    try {
      const b64 = FREDDY_LOGO.split(',')[1];
      const bytes = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
      children.push(new Paragraph({ children:[ new ImageRun({ data:bytes, transformation:{width:220, height:91} }) ], spacing:{after:200} }));
    } catch(e){}
    children.push(new Paragraph({ children:[new TextRun({text:'Informe de Mantenimiento de Flota', bold:true, size:40, color:'1E1E1E'})], spacing:{after:80} }));
    children.push(new Paragraph({ children:[new TextRun({text:'Proyecto Vicuña', bold:true, size:28, color:RED})], spacing:{after:200} }));
    children.push(P('Freddy El Taller S.R.L. — Mantenimiento de livianos', {color:'5A5A5A'}));
    children.push(P('Servicio prestado a: Vicuña Argentina S.A.', {color:'5A5A5A'}));
    children.push(P('Fecha de emisión: '+D.fecha, {color:'5A5A5A', after:240}));

    // ---- Resumen ejecutivo ----
    children.push(H('Resumen ejecutivo'));
    children.push(tbl(
      [cell('Indicador',{head:true,w:60}), cell('Valor',{head:true,w:40,align:AlignmentType.RIGHT})],
      [
        ['Unidades intervenidas', D.nUnid],
        ['Órdenes de trabajo realizadas', D.otAll.length],
        ['Repuestos utilizados', D.repTotal],
        ['Servicios de mantenimiento preventivo (PM)', D.pmCount],
        ['Intervenciones correctivas', D.corrCount],
        ['Costo total de mantenimiento', fmtUSD(D.costoTotal)]
      ].map(r=> new TableRow({children:[cell(r[0],{w:60}), cell(r[1],{w:40,align:AlignmentType.RIGHT})]}))
    ));

    // ---- Turnos por área ----
    if(D.areaArr.length){
      children.push(H('Turnos por área'));
      children.push(tbl(
        [cell('Área',{head:true,w:70}), cell('Turnos',{head:true,w:30,align:AlignmentType.RIGHT})],
        D.areaArr.map(([a,n])=> new TableRow({children:[cell(a,{w:70}), cell(n,{w:30,align:AlignmentType.RIGHT})]}))
      ));
    }

    // ---- Repuestos más consumidos ----
    children.push(H('Repuestos más consumidos'));
    children.push(tbl(
      [cell('Repuesto',{head:true,w:60}), cell('Cant.',{head:true,w:18,align:AlignmentType.RIGHT}), cell('Costo USD',{head:true,w:22,align:AlignmentType.RIGHT})],
      D.topRep.map(r=> new TableRow({children:[cell(r.desc,{w:60,size:16}), cell(r.cant,{w:18,align:AlignmentType.RIGHT}), cell(r.usd.toLocaleString('es-AR',{maximumFractionDigits:0}),{w:22,align:AlignmentType.RIGHT})]}))
    ));

    // ---- Ranking de unidades ----
    children.push(H('Ranking de unidades por gasto'));
    children.push(tbl(
      [cell('Patente',{head:true,w:40}), cell('Interv.',{head:true,w:30,align:AlignmentType.RIGHT}), cell('Costo USD',{head:true,w:30,align:AlignmentType.RIGHT})],
      D.ranking.map(r=> new TableRow({children:[cell(r.patente,{w:40}), cell(r.int,{w:30,align:AlignmentType.RIGHT}), cell(r.usd.toLocaleString('es-AR',{maximumFractionDigits:0}),{w:30,align:AlignmentType.RIGHT})]}))
    ));

    // ---- Detalle por unidad ----
    children.push(H('Detalle por unidad'));
    Object.keys(D.ot).sort().forEach(pat=>{
      const arr = D.ot[pat].slice().sort((a,b)=>(a.km_efectivo||0)-(b.km_efectivo||0));
      children.push(new Paragraph({ children:[new TextRun({text:pat+'  ·  '+(arr[0]?.modelo||''), bold:true, color:'FFFFFF', size:22})], shading:{fill:RED,type:ShadingType.CLEAR,color:'auto'}, spacing:{before:200,after:80} }));
      arr.forEach(o=>{
        children.push(new Paragraph({ children:[new TextRun({text:`OT ${o.nro||''} · ${o.fecha||''} · ${(o.km_efectivo||0).toLocaleString('es-AR')} km · ${o.tipo||''} · Total ${fmtUSD(o.total_usd)}`, bold:true, size:18, color:GRAY})], spacing:{before:80,after:40} }));
        const rows=[];
        (o.repuestos||[]).forEach(r=> rows.push(new TableRow({children:[cell(r.cant+'× '+r.desc,{w:75,size:16}), cell(r.usd?('USD '+r.usd.toLocaleString('es-AR',{maximumFractionDigits:0})):'',{w:25,align:AlignmentType.RIGHT,size:16})]})));
        (o.trabajos||[]).forEach(t=> rows.push(new TableRow({children:[cell('(MO) '+t.desc,{w:75,size:16}), cell(t.usd?('USD '+t.usd.toLocaleString('es-AR',{maximumFractionDigits:0})):'',{w:25,align:AlignmentType.RIGHT,size:16})]})));
        if(rows.length) children.push(new Table({width:{size:100,type:WidthType.PERCENTAGE}, rows}));
      });
    });

    const doc = new Document({ sections:[{ properties:{}, children }] });
    Packer.toBlob(doc).then(blob=>{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download='Informe_Mantenimiento_Vicuna_'+new Date().toISOString().slice(0,10)+'.docx';
      a.click(); URL.revokeObjectURL(url);
      if(st) st.textContent='✅ Word generado.';
    }).catch(e=>{ console.error(e); if(st) st.textContent='Error Word: '+e.message; });
  } catch(e){ console.error(e); if(st) st.textContent='Error al generar Word: '+e.message; }
}



/* =====================================================================
   INFORME COMPLETO DE INDICADORES (PDF + Word) — con selector de mes
   Usa la "foto" del Dashboard (window.__dash) para calcular exactamente
   lo mismo que se ve en pantalla, y suma el detalle orden por orden.
