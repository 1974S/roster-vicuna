function openInformeCompleto(){
  const D = window.__dash;
  const meses = D ? D.mesesEvol.filter(m=>!m.esFuturo && m.ind) : [];
  const opts = meses.map(m=>`<option value="${m.key}" ${m.esActual?'selected':''}>${m.nombre} de ${m.key.slice(0,4)}${m.esActual?' (mes en curso)':''}</option>`).join('');
  const modal = document.createElement('div');
  modal.id = 'infCompModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:flex-end;justify-content:center;';
  modal.innerHTML = `
    <div style="background:var(--bg);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px 16px 30px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <span style="font-size:17px;font-weight:700;">📊 Informe completo de indicadores</span>
        <button onclick="document.getElementById('infCompModal').remove()" style="background:none;border:none;font-size:22px;color:var(--text2);">✕</button>
      </div>
      <p style="font-size:13px;color:var(--text2);margin:0 0 14px;">Incluye disponibilidad, MKBF, MKBF programado, MTTR, evolución mensual, Sede vs Mina, intervenciones por categoría y subcategoría, horas hombre y el detalle de cada orden del mes. No incluye costos.</p>
      ${meses.length ? `
      <label style="font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.04em;">MES DEL INFORME</label>
      <select id="infCompMes" style="width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:15px;margin:6px 0 14px;">${opts}</select>
      <button onclick="generarInformeCompletoPDF()" style="width:100%;padding:14px;border-radius:12px;background:var(--red);color:#fff;border:none;font-weight:700;font-size:15px;margin-bottom:10px;">📕 Descargar PDF</button>
      <button onclick="generarInformeCompletoWord()" style="width:100%;padding:14px;border-radius:12px;background:var(--card);color:var(--text);border:1.5px solid var(--border);font-weight:700;font-size:15px;">📘 Descargar Word</button>`
      : `<div style="font-size:13px;color:var(--text2);padding:10px 0;">Abrí primero la pestaña Dashboard para que se carguen los indicadores y volvé a tocar este botón.</div>`}
      <div id="infCompStatus" style="font-size:12px;color:var(--text3);text-align:center;margin-top:12px;"></div>
    </div>`;
  document.body.appendChild(modal);
}

function informeCompletoBloques(mesKey){
  const D = window.__dash;
  if (!D) return null;
  const idx = D.mesesEvol.findIndex(m=>m.key===mesKey);
  if (idx < 0 || !D.mesesEvol[idx].ind) return null;
  const M = D.mesesEvol[idx];
  const P = idx > 0 ? D.mesesEvol[idx-1] : null;
  const ind = M.ind, indP = P ? P.ind : null;
  const anio = mesKey.slice(0,4);
  const tituloMes = M.nombre + ' de ' + anio;
  const tituloPrev = P ? P.nombre + ' de ' + anio : null;

  const N = (v, suf, dec) => (v===null||v===undefined||isNaN(v)) ? '—' : v.toLocaleString('es-AR',{maximumFractionDigits:dec||0}) + (suf||'');
  const pct = (n,t) => t>0 ? (Math.round(n/t*1000)/10).toLocaleString('es-AR',{maximumFractionDigits:1}) + '%' : '—';
  const fFmt = iso => iso ? String(iso).split('-').reverse().join('/') : '—';
  const cortar = (t,n) => { t = String(t||'').replace(/\s+/g,' ').trim(); return t.length>n ? t.slice(0,n-1)+'…' : t; };
  const mttrDe = i => i ? (i.mttrReal!==null ? i.mttrReal : D.mttrFijo) : null;
  const mttrTxt = i => i ? (N(mttrDe(i),' hs',2) + (i.mttrReal!==null ? ' (real)' : ' (estimado)')) : '—';
  const dispTxt = i => i ? i.dispPct.toFixed(2).replace('.',',') + '%' : '—';

  const B = [];

  // ---- 1) Resumen ----
  B.push({ t:'h1', text:'Resumen de indicadores — ' + tituloMes });
  if (M.esActual) B.push({ t:'p', text:'Mes en curso: los valores están calculados hasta el día de hoy.' });
  B.push({ t:'cards', items:[
    { label:'Disponibilidad de la flota', value: dispTxt(ind) },
    { label:'MKBF (km entre fallas)', value: N(ind.mkbf,' km') },
    { label:'MKBF programado (km entre PM)', value: N(ind.mkbfProg,' km') },
    { label:'MTTR', value: mttrTxt(ind) }
  ]});

  // ---- 2) Detalle de indicadores vs mes anterior ----
  B.push({ t:'h1', text:'Indicadores de flota' });
  B.push({ t:'table',
    head:['Indicador', tituloMes, tituloPrev || 'Mes anterior', 'Cómo se calcula / detalle'],
    align:['l','r','r','l'], widths:[34,26,26,92],
    body:[
      ['Disponibilidad de la flota', dispTxt(ind), dispTxt(indP),
        `${ind.hTotal} hs de detención sobre ${N(ind.hDisp)} hs disponibles (${ind.hProg} hs / ${ind.eProg} programadas y ${ind.hImprev} hs / ${ind.eImprev} imprevistas).`],
      ['MKBF (km entre fallas correctivas)', N(ind.mkbf,' km'), indP ? N(indP.mkbf,' km') : '—',
        `${N(ind.kmRec)} km recorridos por las unidades con lectura de km (${ind.unidadesKm}) ÷ ${ind.eImprev} correctivos.`],
      ['MKBF programado (km entre PM realizados)', N(ind.mkbfProg,' km'), indP ? N(indP.mkbfProg,' km') : '—',
        `${N(ind.kmRec)} km ÷ ${ind.nPM} PM realizados en esas mismas unidades (OT y rosters, sin inspecciones mensuales).`],
      ['MTTR (tiempo medio de reparación)', mttrTxt(ind), mttrTxt(indP),
        ind.mttrReal!==null ? `Promedio real de ${ind.cantReales} reparación${ind.cantReales!==1?'es':''} cargadas en rosters (sin PM).` : `Sin reparaciones reales cargadas este mes: se usa la hora fija estimada (${D.mttrFijo} hs).`]
    ]});

  // ---- 3) Evolución mensual ----
  B.push({ t:'h1', text:'Evolución mensual ' + anio });
  B.push({ t:'table', head:['Mes','Disponibilidad','MKBF prog.','MKBF corr.','MTTR'], align:['l','r','r','r','r'],
    body: D.mesesEvol.filter(m=>!m.esFuturo && m.ind).map(m=>[
      m.nombre + (m.key===mesKey ? ' •' : '') + (m.esActual ? ' *' : ''),
      dispTxt(m.ind), N(m.ind.mkbfProg,' km'), N(m.ind.mkbf,' km'), mttrTxt(m.ind)
    ])});
  B.push({ t:'p', small:true, text:'* Mes en curso, calculado hasta hoy. • Mes de este informe.' });

  // ---- 4) Sede vs Mina ----
  const L = D.contarLugarMes(mesKey), LP = P ? D.contarLugarMes(P.key) : null;
  B.push({ t:'h1', text:'Intervenciones: Sede vs Mina' });
  B.push({ t:'table', head:['Lugar', tituloMes+' — órdenes', '%', (tituloPrev||'Mes anterior')+' — órdenes', '%'], align:['l','r','r','r','r'],
    body:[
      ['Sede (taller San Juan)', String(L.sede), pct(L.sede,L.total), LP ? String(LP.sede) : '—', LP ? pct(LP.sede,LP.total) : '—'],
      ['Mina', String(L.mina), pct(L.mina,L.total), LP ? String(LP.mina) : '—', LP ? pct(LP.mina,LP.total) : '—'],
      ['Total', String(L.total), L.total>0?'100%':'—', LP ? String(LP.total) : '—', LP && LP.total>0 ? '100%' : '—']
    ], boldLast:true });
  B.push({ t:'p', small:true, text:'Se clasifica por el nombre: Sede = OT de Diego Ares; Mina = OT de Manzini o Quiroga (asesor de servicio y, si no figura, técnico o supervisor; como último recurso, el sector).' + (L.sin>0 ? ` ${L.sin} orden${L.sin!==1?'es':''} del mes no se pudieron clasificar.` : '') });

  // ---- 5) Intervenciones por categoría y subcategoría ----
  const C = D.contarCategoriasMes(mesKey), CP = P ? D.contarCategoriasMes(P.key) : null;
  B.push({ t:'h1', text:'Intervenciones por categoría' });
  const catRows = [];
  D.CATEGORIAS_INT.forEach(cat=>{
    const n = C.cnt[cat.cod] || 0, nP = CP ? (CP.cnt[cat.cod]||0) : 0;
    if (!n && !nP) return;
    catRows.push([cat.cod+'-'+cat.nombre, String(n), pct(n,C.total), CP ? pct(nP,CP.total) : '—']);
    const nombres = (cat.subs||[]).map(s=>s.nombre).concat(['Otros']);
    nombres.forEach(nom=>{
      const ns = ((C.sub[cat.cod]||{})[nom]) || 0, nsP = CP ? (((CP.sub[cat.cod]||{})[nom]) || 0) : 0;
      if (!ns && !nsP) return;
      catRows.push(['    ' + nom, String(ns), pct(ns,C.total), CP ? pct(nsP,CP.total) : '—']);
    });
  });
  catRows.push(['Sin clasificar', String(C.cnt.otros||0), pct(C.cnt.otros||0,C.total), CP ? pct(CP.cnt.otros||0,CP.total) : '—']);
  catRows.push(['Total intervenciones', String(C.total), C.total>0?'100%':'—', CP && CP.total>0 ? '100%' : '—']);
  B.push({ t:'table', head:['Categoría','Cantidad','% de '+M.nombre, '% de '+(P?P.nombre:'mes anterior')], align:['l','r','r','r'], widths:[92,26,30,30], body:catRows, boldLast:true });
  B.push({ t:'p', small:true, text:'00 = PM y chequeos mensuales en mina (rosters). 01 = PM en San Juan (OT de Sede). 02 al 10 = reparaciones por sistema, 11 = lavado completo y 12 = cambio de pértiga (estos dos cuentan solo cuando la intervención no incluye la reparación de otro sistema). La mina se cuenta con los rosters y San Juan con las OT de Sede.' });

  // ---- 6) Horas hombre por roster ----
  const consum = {};
  Object.values(reparacionesReales||{}).forEach(r=>{
    if (typeof r.horasHombre==='number' && r.rosterFecha && r.rosterFecha.startsWith(mesKey)) consum[r.rosterFecha] = (consum[r.rosterFecha]||0) + r.horasHombre;
  });
  const metas = Object.values(rostersMeta||{}).filter(m=>m.fecha && m.fecha.startsWith(mesKey));
  const fechasR = Array.from(new Set([...metas.map(m=>m.fecha), ...Object.keys(consum)])).sort();
  B.push({ t:'h1', text:'Horas hombre por roster' });
  if (!fechasR.length) {
    B.push({ t:'p', text:'No hay rosters cargados para este mes.' });
  } else {
    B.push({ t:'table', head:['Roster (fecha)','Supervisor','Hs. consumidas','Hs. disponibles','Utilización'], align:['l','l','r','r','r'],
      body: fechasR.map(f=>{
        const meta = metas.find(m=>m.fecha===f) || null;
        const disp = meta && meta.horasDisponibles ? meta.horasDisponibles : null;
        const cons = consum[f] || 0;
        return [fFmt(f), meta ? (meta.supervisor||'—') : '—', N(cons,' hs'), disp!==null ? N(disp,' hs') : '—', disp ? pct(cons,disp) : '—'];
      })});
    B.push({ t:'p', small:true, text:'Horas disponibles = horas del turno día × 14 días por roster.' });
  }

  // ---- 8) Detalle de órdenes de trabajo (OT) ----
  const nomCat = cod => { const c = D.CATEGORIAS_INT.find(x=>x.cod===cod); return c ? cod+'-'+c.nombre : 'Sin clasificar'; };
  const ots = [];
  Object.values(otData||{}).forEach(arr=>(arr||[]).forEach(o=>{ if (o.fecha_iso && o.fecha_iso.startsWith(mesKey) && o.tipo!=='Venta') ots.push(o); }));
  ots.sort((a,b)=> (a.fecha_iso||'').localeCompare(b.fecha_iso||'') || ((parseInt(a.nro)||0)-(parseInt(b.nro)||0)));
  B.push({ t:'h1', text:'Detalle de órdenes de trabajo — ' + tituloMes });
  if (!ots.length) {
    B.push({ t:'p', text:'No hay órdenes de trabajo cargadas para este mes.' });
  } else {
    let nSede = 0, nMina = 0;
    const rows = ots.map(o=>{
      const lugar = D.clasificarLugarOT(o);
      if (lugar==='sede') nSede++; else if (lugar==='mina') nMina++;
      const textos = [...(o.trabajos||[]).map(t=>t.desc), ...(o.repuestos||[]).map(r=>r.desc)];
      let cat;
      if (o.tipo==='PM') cat = lugar==='sede' ? nomCat('01') : (lugar==='mina' ? nomCat('00') : 'PM');
      else { const cod = D.sistemaDeTextos(textos); cat = cod ? (nomCat(cod) + (D.subDeCategoria(cod,textos) ? ' · '+D.subDeCategoria(cod,textos) : '')) : 'Sin clasificar'; }
      const det = [...(o.repuestos||[]).map(r=>`${r.cant||1}× ${r.desc || r.codigo || 'repuesto'}`), ...(o.trabajos||[]).map(t=>'(MO) '+(t.desc||''))].join('; ');
      return [String(o.nro||''), fFmt(o.fecha_iso), o.patente||'', o.tipo||'', lugar==='sede'?'Sede':(lugar==='mina'?'Mina':'—'), cat, cortar(det||'Sin ítems detallados',170)];
    });
    rows.push(['','','','','','','Total ('+ots.length+' órdenes)']);
    B.push({ t:'p', text:`${ots.length} órdenes: ${nSede} de Sede y ${nMina} de Mina.` });
    B.push({ t:'table', head:['N° OT','Fecha','Patente','Tipo','Lugar','Categoría','Repuestos y trabajos'], align:['l','l','l','l','l','l','l'],
      widths:[11,17,17,18,11,33,66], small:true, body:rows, boldLast:true });
  }

  // ---- 9) Detalle de reparaciones de rosters (mina) ----
  const reps = Object.values(reparacionesReales||{}).filter(r=>r.fecha && r.fecha.startsWith(mesKey))
    .sort((a,b)=> a.fecha.localeCompare(b.fecha) || ((parseInt(a.nOtFreddy)||0)-(parseInt(b.nOtFreddy)||0)));
  B.push({ t:'h1', text:'Detalle de reparaciones de mina (rosters) — ' + tituloMes });
  if (!reps.length) {
    B.push({ t:'p', text:'No hay reparaciones de roster cargadas para este mes.' });
  } else {
    let sHs = 0, sHH = 0;
    const esProg = t => { const u = String(t||'').toLowerCase().trim(); return u==='pm' || /chequeo mensual/.test(u); };
    const rows = reps.map(r=>{
      sHs += (r.tiempoReparacionHoras||0); sHH += (r.horasHombre||0);
      const textos = [r.tipo, r.causa];
      let cat;
      if (esProg(r.tipo)) cat = nomCat('00') + (D.subDeCategoria('00',[r.tipo]) ? ' · '+D.subDeCategoria('00',[r.tipo]) : '');
      else { const cod = D.sistemaDeTextos(textos); cat = cod ? (nomCat(cod) + (D.subDeCategoria(cod,textos) ? ' · '+D.subDeCategoria(cod,textos) : '')) : 'Sin clasificar'; }
      const det = [r.causa, r.reparacionRealizada].filter(Boolean).join(' — ');
      return [fFmt(r.fecha), r.patente||'', r.tipo||'', cortar(det,170), N(r.tiempoReparacionHoras,'',1), N(r.horasHombre,'',1), cat];
    });
    rows.push(['','','','Total ('+reps.length+' reparaciones)', N(sHs,'',1), N(sHH,'',1), '']);
    B.push({ t:'table', head:['Fecha','Patente','Tipo','Causa y reparación realizada','Hs rep.','Hs hombre','Categoría'], align:['l','l','l','l','r','r','l'],
      widths:[17,17,25,62,11,13,33], small:true, body:rows, boldLast:true });
  }

  return { mes: tituloMes, mesKey, fecha: new Date().toLocaleDateString('es-AR'), bloques: B };
}

/* ---------- PDF ---------- */
function generarInformeCompletoPDF(){
  const st = document.getElementById('infCompStatus');
  const mesKey = (document.getElementById('infCompMes')||{}).value;
  try {
    const R = informeCompletoBloques(mesKey);
    if (!R) { if (st) st.textContent = 'Abrí primero el Dashboard y elegí un mes con datos.'; return; }
    if (st) st.textContent = 'Generando PDF…';
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'mm', format:'a4'});
    const W = 210, M = 16;
    let y = 0;
    const asegurar = h => { if (y + h > 275) { doc.addPage(); y = M + 4; } };

    // Portada
    try { doc.addImage(FREDDY_LOGO, 'PNG', M, 20, 80, 33); } catch(e){}
    y = 66;
    doc.setDrawColor(204,0,0); doc.setLineWidth(1); doc.line(M, y, W-M, y); y += 14;
    doc.setFont('helvetica','bold'); doc.setFontSize(22); doc.setTextColor(30,30,30);
    doc.text('Informe completo de indicadores', M, y); y += 10;
    doc.setFontSize(15); doc.setTextColor(204,0,0);
    doc.text('Proyecto Vicuña — ' + R.mes, M, y); y += 14;
    doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(90,90,90);
    doc.text('Freddy El Taller S.R.L. — Mantenimiento de livianos', M, y); y += 6;
    doc.text('Servicio prestado a: Vicuña Argentina S.A.', M, y); y += 6;
    doc.text('Fecha de emisión: ' + R.fecha, M, y); y += 16;

    R.bloques.forEach(b=>{
      if (b.t === 'h1') {
        asegurar(28);
        doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(30,30,30);
        doc.text(b.text, M, y); y += 3;
        doc.setDrawColor(204,0,0); doc.setLineWidth(0.5); doc.line(M, y, M+22, y); y += 6;
      } else if (b.t === 'p') {
        doc.setFont('helvetica', 'normal'); doc.setFontSize(b.small ? 8 : 10); doc.setTextColor(b.small ? 110 : 60, b.small ? 110 : 60, b.small ? 110 : 60);
        const lines = doc.splitTextToSize(b.text, W - 2*M);
        asegurar(lines.length * (b.small ? 3.6 : 4.6) + 2);
        doc.text(lines, M, y); y += lines.length * (b.small ? 3.6 : 4.6) + 5;
      } else if (b.t === 'cards') {
        const cw = (W - 2*M - 6) / 2, ch = 22;
        asegurar(Math.ceil(b.items.length/2) * (ch+6) + 4);
        b.items.forEach((c,i)=>{
          const cx = M + (i%2)*(cw+6), cy = y + Math.floor(i/2)*(ch+6);
          doc.setFillColor(247,247,249); doc.setDrawColor(225,225,228);
          doc.roundedRect(cx, cy, cw, ch, 2, 2, 'FD');
          doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(204,0,0);
          doc.text(String(c.value), cx + cw/2, cy + 10, {align:'center'});
          doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(100,100,100);
          doc.text(c.label, cx + cw/2, cy + 17, {align:'center'});
        });
        y += Math.ceil(b.items.length/2) * (ch+6) + 6;
      } else if (b.t === 'table') {
        asegurar(24);
        const total = (b.widths||[]).reduce((a,c)=>a+c,0) || 1;
        const cs = {};
        b.align.forEach((a,i)=>{
          cs[i] = {};
          if (a === 'r') cs[i].halign = 'right';
          if (b.widths) cs[i].cellWidth = (W - 2*M) * b.widths[i] / total;
        });
        doc.autoTable({
          startY: y, margin:{left:M, right:M},
          head:[b.head], body:b.body, theme:'striped',
          headStyles:{fillColor:[204,0,0], fontSize: b.small ? 7.5 : 8.5},
          bodyStyles:{fontSize: b.small ? 7 : 8.5, cellPadding: b.small ? 1.4 : 2},
          columnStyles: cs,
          didParseCell: (d)=>{
            if (d.section === 'head' && b.align[d.column.index] === 'r') d.cell.styles.halign = 'right';
            if (d.section !== 'body') return;
            const first = String(d.row.raw && d.row.raw[0] != null ? d.row.raw[0] : '');
            if (first.indexOf('    ') === 0) { d.cell.styles.textColor = [110,110,110]; d.cell.styles.fontSize = (b.small ? 6.5 : 7.5); }
            if (b.boldLast && d.row.index === b.body.length - 1) d.cell.styles.fontStyle = 'bold';
          }
        });
        y = doc.lastAutoTable.finalY + 8;
      }
    });

    const pages = doc.internal.getNumberOfPages();
    for (let i=1; i<=pages; i++) {
      doc.setPage(i);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(150,150,150);
      doc.text('Freddy El Taller S.R.L. — Informe completo de indicadores · Proyecto Vicuña · ' + R.mes, M, 290);
      doc.text('Página ' + i + ' de ' + pages, W-M, 290, {align:'right'});
    }
    doc.save('Informe_Completo_Indicadores_Vicuna_' + R.mesKey + '.pdf');
    if (st) st.textContent = '✅ PDF generado.';
  } catch(e){ console.error(e); if (st) st.textContent = 'Error al generar PDF: ' + e.message; }
}

/* ---------- Word ---------- */
function generarInformeCompletoWord(){
  const st = document.getElementById('infCompStatus');
  const mesKey = (document.getElementById('infCompMes')||{}).value;
  try {
    const R = informeCompletoBloques(mesKey);
    if (!R) { if (st) st.textContent = 'Abrí primero el Dashboard y elegí un mes con datos.'; return; }
    if (st) st.textContent = 'Generando Word…';
    const dx = window.docx;
    const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, AlignmentType, ImageRun, ShadingType, TableLayoutType } = dx;
    const ANCHO = 10306; // ancho útil de la hoja A4 con los márgenes elegidos (en twips)
    const RED = 'CC0000';

    const P = (text, o={}) => new Paragraph({ children:[new TextRun({text, bold:o.bold, size:o.size||22, color:o.color})], spacing:{after:o.after!==undefined?o.after:100} });
    const H = text => new Paragraph({ children:[new TextRun({text, bold:true, size:28, color:RED})], spacing:{before:280, after:120}, keepNext:true });
    const celda = (text, o={}) => new TableCell({
      width:{ size:o.wd, type:WidthType.DXA },
      shading: o.head ? { fill:RED, type:ShadingType.CLEAR, color:'auto' } : (o.sub ? { fill:'F2F2F2', type:ShadingType.CLEAR, color:'auto' } : undefined),
      children:[ new Paragraph({ alignment:o.align, children:[ new TextRun({ text:String(text), bold:o.head||o.bold, color:o.head?'FFFFFF':(o.sub?'666666':undefined), size:o.size||18 }) ] }) ]
    });

    const children = [];
    try {
      const b64 = FREDDY_LOGO.split(',')[1];
      const bytes = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
      children.push(new Paragraph({ children:[ new ImageRun({ data:bytes, transformation:{width:220, height:91} }) ], spacing:{after:200} }));
    } catch(e){}
    children.push(new Paragraph({ children:[new TextRun({text:'Informe completo de indicadores', bold:true, size:40, color:'1E1E1E'})], spacing:{after:80} }));
    children.push(new Paragraph({ children:[new TextRun({text:'Proyecto Vicuña — ' + R.mes, bold:true, size:28, color:RED})], spacing:{after:200} }));
    children.push(P('Freddy El Taller S.R.L. — Mantenimiento de livianos', {color:'5A5A5A'}));
    children.push(P('Servicio prestado a: Vicuña Argentina S.A.', {color:'5A5A5A'}));
    children.push(P('Fecha de emisión: ' + R.fecha, {color:'5A5A5A', after:240}));

    R.bloques.forEach(b=>{
      if (b.t === 'h1') children.push(H(b.text));
      else if (b.t === 'p') children.push(P(b.text, { size:b.small?16:20, color:b.small?'6E6E6E':'3C3C3C', after:120 }));
      else if (b.t === 'cards') {
        const w1 = Math.round(ANCHO*0.6), w2 = ANCHO - w1;
        children.push(new Table({ width:{size:ANCHO,type:WidthType.DXA}, columnWidths:[w1,w2], layout:TableLayoutType.FIXED, rows:[
          new TableRow({ tableHeader:true, children:[ celda('Indicador',{head:true,wd:w1}), celda('Valor',{head:true,wd:w2,align:AlignmentType.RIGHT}) ] }),
          ...b.items.map(c=> new TableRow({ children:[ celda(c.label,{wd:w1}), celda(c.value,{wd:w2,align:AlignmentType.RIGHT,bold:true}) ] }))
        ]}));
      } else if (b.t === 'table') {
        const total = (b.widths||[]).reduce((a,c)=>a+c,0);
        const cols = b.head.map((h,i)=> total ? Math.round(b.widths[i]/total*ANCHO) : Math.round(ANCHO/b.head.length));
        const wOf = i => cols[i];
        const size = b.small ? 14 : 17;
        children.push(new Table({ width:{size:ANCHO,type:WidthType.DXA}, columnWidths:cols, layout:TableLayoutType.FIXED, rows:[
          new TableRow({ tableHeader:true, children: b.head.map((h,i)=> celda(h,{head:true,wd:wOf(i),size, align:b.align[i]==='r'?AlignmentType.RIGHT:undefined})) }),
          ...b.body.map((r,ri)=>{
            const esSub = String(r[0]).indexOf('    ') === 0;
            const negrita = b.boldLast && ri === b.body.length - 1;
            return new TableRow({ children: r.map((v,i)=> celda(esSub && i===0 ? '      '+String(v).trim() : v, {wd:wOf(i), size, sub:esSub, bold:negrita, align:b.align[i]==='r'?AlignmentType.RIGHT:undefined})) });
          })
        ]}));
        children.push(new Paragraph({ children:[], spacing:{after:80} }));
      }
    });

    const doc = new Document({ sections:[{ properties:{ page:{ margin:{ top:900, bottom:900, left:800, right:800 } } }, children }] });
    Packer.toBlob(doc).then(blob=>{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'Informe_Completo_Indicadores_Vicuna_' + R.mesKey + '.docx';
      a.click(); URL.revokeObjectURL(url);
      if (st) st.textContent = '✅ Word generado.';
    }).catch(e=>{ console.error(e); if (st) st.textContent = 'Error Word: ' + e.message; });
  } catch(e){ console.error(e); if (st) st.textContent = 'Error al generar Word: ' + e.message; }
}

// Reemplaza (o vacía) una celda del XML de la hoja conservando su estilo.
function kpiSetCell(xml, ref, valor, estilo){
  const re = new RegExp('<c r="' + ref + '"([^>]*?)(?:/>|>[\\s\\S]*?</c>)');
  const m = re.exec(xml);
  if (!m) return xml;                                  // la celda no existe en la plantilla: no se toca
  const sm = /\ss="(\d+)"/.exec(m[1]);
  const s = (estilo !== undefined && estilo !== null) ? estilo : (sm ? sm[1] : null);
  const sAttr = s !== null ? ' s="' + s + '"' : '';
  const nuevo = (valor === null || valor === undefined)
    ? '<c r="' + ref + '"' + sAttr + '/>'
    : '<c r="' + ref + '"' + sAttr + '><v>' + Number(valor.toFixed(6)) + '</v></c>';
  return xml.replace(re, function(){ return nuevo; });
}

// Valores de cada renglón para un mes (mismos cálculos que el Dashboard)
function kpiValoresMes(D, m){
  const key = m.key, ind = m.ind;
  const hoy = new Date();
  const hoyISO = hoy.getFullYear() + '-' + String(hoy.getMonth()+1).padStart(2,'0') + '-' + String(hoy.getDate()).padStart(2,'0');
  const ultimoDia = new Date(parseInt(key.slice(0,4)), parseInt(key.slice(5,7)), 0).getDate();
  const limite = m.esActual ? hoyISO : key + '-' + String(ultimoDia).padStart(2,'0');

  // 2.- HH efectivas / HH programadas = horas hombre consumidas / disponibles de los rosters del mes
  const consPorRoster = {};
  Object.values(reparacionesReales||{}).forEach(r=>{
    if (typeof r.horasHombre === 'number' && r.rosterFecha && r.rosterFecha.startsWith(key))
      consPorRoster[r.rosterFecha] = (consPorRoster[r.rosterFecha]||0) + r.horasHombre;
  });
  let hhCons = 0, hhDisp = 0;
  Object.values(rostersMeta||{}).forEach(x=>{
    if (x.fecha && x.fecha.startsWith(key) && x.horasDisponibles) { hhDisp += x.horasDisponibles; hhCons += (consPorRoster[x.fecha]||0); }
  });
  const hh = hhDisp > 0 ? hhCons / hhDisp : null;

  // 3.- Equipos ejecutados / Equipos programados = unidades con turno cumplido / unidades con turno en la agenda del mes
  const prog = new Set(), ejec = new Set();
  (Array.isArray(events) ? events : []).forEach(e=>{
    if (!e || !e.fecha || !e.fecha.startsWith(key) || e.fecha > limite) return;
    if (e.pm !== 'PM5' && e.pm !== 'INSP' && e.pm !== 'PRED') return;
    const pat = String(e.dom||'').trim().toUpperCase(); if (!pat) return;
    prog.add(pat); if (e.cumplido) ejec.add(pat);
  });
  const equipos = prog.size > 0 ? ejec.size / prog.size : null;

  return {
    disp: ind.dispPct / 100,
    hh, hhCons, hhDisp,
    equipos, eqProg: prog.size, eqEjec: ejec.size,
    mtbf: (ind.mkbf !== null && ind.mkbf !== undefined) ? Math.round(ind.mkbf) : null,
    mttr: (ind.mttrReal !== null && ind.mttrReal !== undefined) ? Math.round(ind.mttrReal*100)/100 : null
  };
}

async function generarPlanillaKPI(){
  const D = window.__dash;
  if (!D) { alert('Abrí primero el Dashboard para que se carguen los indicadores y volvé a tocar el botón.'); return; }
  if (typeof JSZip === 'undefined') { alert('No se pudo cargar la librería para armar el Excel (JSZip). Revisá la conexión y probá de nuevo.'); return; }
  try {
    const meses = D.mesesEvol.filter(m => !m.esFuturo && m.ind && m.key >= CONTRATO_INICIO);
    if (!meses.length) { alert('Todavía no hay meses con datos desde el inicio del contrato.'); return; }

    const bytes = Uint8Array.from(atob(PLANTILLA_KPI_B64), c => c.charCodeAt(0));
    const zip = await JSZip.loadAsync(bytes, { createFolders: false });
    let xml = await zip.file('xl/worksheets/sheet1.xml').async('string');

    const resumen = [];
    meses.forEach(m=>{
      const nMes = parseInt(m.key.slice(5,7));
      if (nMes < 4 || nMes > 12) return;                                   // la planilla va de abril a diciembre
      const col = String.fromCharCode(67 + (nMes - 4));                    // C = abril ... K = diciembre
      const v = kpiValoresMes(D, m);
      xml = kpiSetCell(xml, col + '74', v.disp,    66);                    // 1.- Disponibilidad física
      xml = kpiSetCell(xml, col + '75', v.hh,      66);                    // 2.- HH efectivas / HH programadas
      xml = kpiSetCell(xml, col + '76', v.equipos, 66);                    // 3.- Equipos ejecutados / programados
      xml = kpiSetCell(xml, col + '78', v.mtbf,    17);                    // 5.- MTBF (km)
      xml = kpiSetCell(xml, col + '79', v.mttr,    17);                    // 6.- MTTR
      const pc = x => x === null ? 'sin datos' : (x*100).toFixed(1).replace('.',',') + '%';
      resumen.push(`${m.nombre}: disponibilidad ${pc(v.disp)} · HH ${pc(v.hh)} · equipos ${pc(v.equipos)}${v.eqProg?` (${v.eqEjec}/${v.eqProg})`:''} · MTBF ${v.mtbf===null?'sin datos':v.mtbf.toLocaleString('es-AR')+' km'} · MTTR ${v.mttr===null?'sin datos':String(v.mttr).replace('.',',')+' hs'}`);
    });

    zip.file('xl/worksheets/sheet1.xml', xml, { createFolders: false });

    // Excel rehace solo la cadena de cálculo y recalcula todo al abrir
    zip.remove('xl/calcChain.xml');
    let ct = await zip.file('[Content_Types].xml').async('string');
    ct = ct.replace(/<Override PartName="\/xl\/calcChain\.xml"[^>]*\/>/, '');
    zip.file('[Content_Types].xml', ct, { createFolders: false });
    let rels = await zip.file('xl/_rels/workbook.xml.rels').async('string');
    rels = rels.replace(/<Relationship [^>]*calcChain[^>]*\/>/, '');
    zip.file('xl/_rels/workbook.xml.rels', rels, { createFolders: false });
    let wbx = await zip.file('xl/workbook.xml').async('string');
    wbx = wbx.replace(/<calcPr([^>]*?)\/>/, function(_, a){ return /fullCalcOnLoad/.test(a) ? '<calcPr' + a + '/>' : '<calcPr' + a + ' fullCalcOnLoad="1"/>'; });
    zip.file('xl/workbook.xml', wbx, { createFolders: false });

    const blob = await zip.generateAsync({ type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', compression:'DEFLATE' });
    const ultimo = meses[meses.length-1].key;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'Reporte_medicion_acuerdos_KPI_' + ultimo + '.xlsx';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
    alert('Planilla generada con el formato original.\n\nCompletado desde julio (inicio del contrato):\n\n' + resumen.join('\n'));
  } catch(e){ console.error(e); alert('No se pudo generar la planilla: ' + e.message); }
}


/* =====================================================================
   KPI DEL CONTRATO — 6 indicadores contractuales vs. sus metas
   Pantalla (Dashboard) + informe mensual en Word. Desde julio 2026.
   ===================================================================== */
function kpiInicio(){ return '2026-07'; }

// Metas del contrato (si cambian, se tocan acá)
function kpiMetasDef(){
  return {
    disp:    { texto:'≥ 90%',     ok: v => v >= 0.90 },
    hh:      { texto:'≥ 95%',     ok: v => v >= 0.95 },
    equipos: { texto:'≥ 90%',     ok: v => v >= 0.90 },
    seg:     { texto:'100%',      ok: v => v >= 1 },
    mtbf:    { texto:'> 2.500 km', ok: v => v > 2500 },
    mttr:    { texto:'< 100 hs',  ok: v => v < 100 }
  };
}

// Los 5 ítems del indicador 4 (Informe de seguimiento). "meses" = solo aplica en esos meses.
function kpiSegItems(){
  return [
    { id:'diario_semanal', nombre:'Informe diario y semanal' },
    { id:'tecnicos',       nombre:'Informes técnicos' },
    { id:'consumibles',    nombre:'Informe mensual de consumibles con respaldo de OT' },
    { id:'trimestral',     nombre:'Informe trimestral de mantenimiento', meses:[3,6,9,12] },
    { id:'performance',    nombre:'Informe mensual de performance KPIs' }
  ];
}

function kpiEstadoInfo(e){
  return ({
    ok:   { txt:'Cumple',     color:'#2e9e5b', icono:'✅' },
    no:   { txt:'No cumple',  color:'#d93025', icono:'❌' },
    pend: { txt:'En curso',   color:'#e0a100', icono:'🟡' },
    sd:   { txt:'Sin datos',  color:'#8a8a8a', icono:'➖' }
  })[e] || { txt:'Sin datos', color:'#8a8a8a', icono:'➖' };
}

// Devuelve las 6 filas del mes: {n, nombre, meta, valor, estado, detalle}
function kpiContratoMes(D, m){
  const v = kpiValoresMes(D, m), ind = m.ind, M = kpiMetasDef();
  const nfmt = (x, dec) => x.toLocaleString('es-AR', {maximumFractionDigits: dec||0});
  const pc = x => (x===null || x===undefined) ? 'Sin datos' : (Math.round(x*1000)/10).toLocaleString('es-AR',{minimumFractionDigits:1, maximumFractionDigits:1}) + '%';
  const est = (x, regla) => (x===null || x===undefined) ? 'sd' : (regla(x) ? 'ok' : 'no');
  const mesNum = parseInt(m.key.slice(5,7));

  // 4.- Informe de seguimiento (checklist manual)
  const items = kpiSegItems().filter(i => !i.meses || i.meses.indexOf(mesNum) >= 0);
  const marcas = (typeof kpiSeg !== 'undefined' && kpiSeg && kpiSeg[m.key]) || {};
  const hechos = items.filter(i => marcas[i.id]).length;
  const segPct = items.length ? hechos / items.length : null;
  let segEstado;
  if (segPct === 1) segEstado = 'ok';
  else if (m.esActual) segEstado = 'pend';
  else segEstado = hechos === 0 ? 'sd' : 'no';

  // 6.- MTTR: promedio real si hay reparaciones cargadas en rosters; si no, la hora fija estimada
  const mttrVal = v.mttr !== null ? v.mttr : D.mttrFijo;

  // 5.- MTBF
  let mtbfValor, mtbfEstado;
  if (v.mtbf !== null) { mtbfValor = nfmt(v.mtbf) + ' km'; mtbfEstado = est(v.mtbf, M.mtbf.ok); }
  else if (ind.eImprev === 0 && ind.kmRec > 0) { mtbfValor = 'Sin fallas'; mtbfEstado = 'ok'; }
  else { mtbfValor = 'Sin datos'; mtbfEstado = 'sd'; }

  return [
    { n:1, nombre:'Disponibilidad física', meta:M.disp.texto, valor: pc(v.disp), estado: est(v.disp, M.disp.ok),
      detalle: `${ind.hTotal} hs de detención sobre ${nfmt(ind.hDisp)} hs disponibles de la flota (${ind.hProg} hs en ${ind.eProg} intervenciones programadas y ${ind.hImprev} hs en ${ind.eImprev} imprevistas).` },
    { n:2, nombre:'Cumplimiento del programa de mantenimiento preventivo (HH efectivas / HH programadas)', meta:M.hh.texto, valor: pc(v.hh), estado: est(v.hh, M.hh.ok),
      detalle: v.hhDisp > 0 ? `${nfmt(v.hhCons,1)} hs hombre consumidas sobre ${nfmt(v.hhDisp)} hs hombre disponibles en los rosters del mes.` : 'No hay rosters cargados este mes.' },
    { n:3, nombre:'Equipos ejecutados / equipos programados', meta:M.equipos.texto, valor: pc(v.equipos), estado: est(v.equipos, M.equipos.ok),
      detalle: v.eqProg > 0 ? `${v.eqEjec} de ${v.eqProg} unidades con turno programado (PM, inspección o predictivo) cumplieron su turno.` : 'No hay turnos programados este mes en la agenda.' },
    { n:4, nombre:'Informe de seguimiento', meta:M.seg.texto, valor: segPct===null ? 'Sin datos' : pc(segPct), estado: segEstado,
      detalle: `${hechos} de ${items.length} informes entregados.` },
    { n:5, nombre:'MTBF (km entre fallas)', meta:M.mtbf.texto, valor: mtbfValor, estado: mtbfEstado,
      detalle: ind.eImprev > 0 ? `${nfmt(ind.kmRec)} km recorridos por las unidades con lectura de km (${ind.unidadesKm}) ÷ ${ind.eImprev} correctivos.` : (ind.kmRec > 0 ? `${nfmt(ind.kmRec)} km recorridos sin correctivos en el mes.` : 'Sin lecturas de km en el mes.') },
    { n:6, nombre:'MTTR (tiempo medio de reparación)', meta:M.mttr.texto, valor: nfmt(mttrVal, 2) + ' hs' + (v.mttr!==null ? '' : ' (est.)'), estado: est(mttrVal, M.mttr.ok),
      detalle: v.mttr !== null ? `Promedio real de ${ind.cantReales} reparación${ind.cantReales!==1?'es':''} cargadas en rosters (sin PM).` : `Sin reparaciones reales cargadas este mes: se usa la hora fija estimada (${D.mttrFijo} hs).` }
  ].map(f => Object.assign(f, { _hechos: hechos, _items: items.length }));
}

function setKpiMes(v){ kpiMesSel = v; if (curTab === 'dashboard') render(); }

function toggleKpiSeg(mesKey, id){
  const cur = !!((kpiSeg[mesKey] || {})[id]);
  const nuevo = Object.assign({}, kpiSeg[mesKey] || {});
  nuevo[id] = !cur;
  kpiSeg[mesKey] = nuevo;
  try { db.ref('kpi_seguimiento/' + mesKey + '/' + id).set(!cur); } catch(e){ console.warn(e); }
  if (curTab === 'dashboard') render();
}

/* ---------- Informe mensual de KPI (Word, formato Freddy) ---------- */
function generarInformeKPIWord(mesKey){
  const D = window.__dash;
  if (!D) { alert('Abrí primero el Dashboard para que se carguen los indicadores.'); return; }
  const meses = D.mesesEvol.filter(m => !m.esFuturo && m.ind && m.key >= kpiInicio());
  const M = meses.find(m => m.key === mesKey);
  if (!M) { alert('No hay datos del mes elegido.'); return; }
  try {
    const dx = window.docx;
    const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, AlignmentType, ImageRun, ShadingType, TableLayoutType, VerticalAlign, Footer, PageNumber } = dx;
    const ANCHO = 10306, RED = 'CC0000', GRIS = 'F2F2F2';
    const anio = mesKey.slice(0,4);
    const periodo = M.nombre + ' de ' + anio;
    const hoy = new Date().toLocaleDateString('es-AR');
    const filas = kpiContratoMes(D, M);

    const run = (text, o={}) => new TextRun({ text:String(text), bold:o.bold, size:o.size||20, color:o.color, italics:o.italics });
    const P = (text, o={}) => new Paragraph({ alignment:o.align, spacing:{ before:o.before||0, after:o.after!==undefined?o.after:100 }, keepNext:o.keepNext, children:[ run(text, o) ] });
    const SEC = (n, text) => new Paragraph({ spacing:{ before:300, after:120 }, keepNext:true, children:[ run(n + '. ' + text, { bold:true, size:24 }) ] });
    const cel = (children, o={}) => new TableCell({
      width:{ size:o.wd, type:WidthType.DXA }, verticalAlign: VerticalAlign.CENTER, columnSpan:o.span,
      shading: o.fill ? { fill:o.fill, type:ShadingType.CLEAR, color:'auto' } : undefined,
      margins:{ top:60, bottom:60, left:100, right:100 },
      children: Array.isArray(children) ? children : [ new Paragraph({ alignment:o.align, children:[ run(children, { bold:o.bold, size:o.size||19, color:o.color }) ] }) ]

      ...kpiSegItems().map(it => {
        const aplica = !it.meses || it.meses.indexOf(mesNum) >= 0;
        const sinRegistro = !M.esActual && !kpiSegItems().some(x => marcas[x.id]);
        const txt = !aplica ? 'No aplica este mes' : (marcas[it.id] ? 'Entregado' : (sinRegistro ? 'Sin registrar' : 'Pendiente'));
        return new TableRow({ cantSplit:true, children:[ cel(it.nombre,{wd:sc[0]}), cel(txt,{wd:sc[1],bold:true,color: (!aplica || sinRegistro) && !marcas[it.id] ? '777777' : (marcas[it.id] ? '2E9E5B' : 'D93025')}) ] });
      })
    ]));

    // --- 4. Evolución desde el inicio del contrato ---
    children.push(SEC(4, 'Evolución desde el inicio del contrato (julio ' + anio + ')'));
    const ec = [1500, 1400, 1400, 1500, 1500, 1500, ANCHO - 1500 - 1400 - 1400 - 1500*3];
    const hd = (t, i) => cel(t, { wd:ec[i], bold:true, fill:GRIS, size:17, align: i>0 ? AlignmentType.RIGHT : undefined });
    children.push(tabla(ec, [
      new TableRow({ tableHeader:true, children:[ hd('Mes',0), hd('1 Disp.',1), hd('2 HH',2), hd('3 Equipos',3), hd('4 Seguim.',4), hd('5 MTBF',5), hd('6 MTTR',6) ] }),
      ...meses.map(m => {
        const fs = kpiContratoMes(D, m);
        return new TableRow({ cantSplit:true, children:[
          cel(m.nombre + (m.esActual ? ' *' : ''), { wd:ec[0], size:17, bold: m.key === mesKey }),
          ...fs.map((f, i) => cel(f.valor.replace(' (est.)','*'), { wd:ec[i+1], size:17, align:AlignmentType.RIGHT, color:colorEstado(f.estado), bold:true }))
        ]});
      })
    ]));
    children.push(P('Metas del contrato: Disponibilidad ' + fs0('disp') + ' · HH ' + fs0('hh') + ' · Equipos ' + fs0('equipos') + ' · Seguimiento ' + fs0('seg') + ' · MTBF ' + fs0('mtbf') + ' · MTTR ' + fs0('mttr') + '. Verde = cumple, rojo = no cumple, amarillo = en curso, gris = sin datos. * Mes en curso o MTTR estimado.', { size:16, color:'6E6E6E', before:80 }));

    // --- 5. Observaciones ---
    children.push(SEC(5, 'Observaciones'));
    const incumplen = filas.filter(f => f.estado === 'no');
    if (incumplen.length) children.push(P('Indicadores fuera de meta en el período: ' + incumplen.map(f => f.n + '.- ' + f.nombre + ' (' + f.valor + ', meta ' + f.meta + ')').join('; ') + '.', { size:19, after:100 }));
    children.push(P('Comentarios del contratista: ', { size:19, after:400 }));

    // --- Firmas ---
    const fw = Math.floor(ANCHO / 3);
    const firma = t => cel([ new Paragraph({ spacing:{ before:500 }, alignment:AlignmentType.CENTER, children:[ run('______________________', { size:18 }) ] }), new Paragraph({ alignment:AlignmentType.CENTER, children:[ run(t, { size:17, bold:true }) ] }) ], { wd:fw });
    children.push(tabla([fw, fw, ANCHO - 2*fw], [ new TableRow({ cantSplit:true, children:[ firma('Elaboró'), firma('Revisó'), firma('Aprobó') ] }) ]));

    const doc = new Document({
      sections:[{
        properties:{ page:{ margin:{ top:900, bottom:900, left:800, right:800 } } },
        footers:{ default: new Footer({ children:[ new Paragraph({ alignment:AlignmentType.CENTER, children:[
          run('Freddy El Taller S.R.L. — Informe mensual de KPI · ' + periodo + ' · Rev. 0 – Borrador para validar · Página ', { size:15, color:'969696' }),
          new TextRun({ children:[ PageNumber.CURRENT ], size:15, color:'969696' })
        ] }) ] }) },
        children
      }]
    });
    Packer.toBlob(doc).then(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'Informe_KPI_Vicuna_' + mesKey + '.docx';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    }).catch(e => { console.error(e); alert('Error al generar el Word: ' + e.message); });
  } catch(e){ console.error(e); alert('No se pudo generar el informe: ' + e.message); }

  function fs0(k){ return kpiMetasDef()[k].texto; }
}


/* ===== FIN SCRIPT PRINCIPAL ===== */
</script>
<script>
/* ===== CONTROL DE ACCESO (inyectado) — script independiente para que
   corra SIEMPRE, aunque el script principal tire un error antes de llegar
   acá (esa era la causa de que el login no apareciera) ===== */
/* ==================== CONTROL DE ACCESO POR ROL ====================
   Pantalla de PIN al abrir. Admin ve todo; Supervisor solo Turnos
   (ver + cargar), sin importar OT, sin informes, sin costos.
   PIN_ADMIN, PIN_SUPERVISOR, userRole, esAdmin() y esSupervisor() ahora
   se declaran arriba de todo, junto al init de Firebase — ver nota ahí.
   ================================================================= */

function accesoInit(){
  // recordar sesión en este dispositivo
  const saved = sessionStorage.getItem('fv_role');
  if(saved === 'admin' || saved === 'supervisor' || saved === 'supervisor_vicuna'){ userRole = saved; aplicarRol(); return; }
  mostrarLogin();
}

function mostrarLogin(){
  const ov = document.createElement('div');
  ov.id = 'loginOverlay';
  ov.style.cssText = 'position:fixed;inset:0;background:var(--bg,#0d0d0d);z-index:100000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;';
  ov.innerHTML = `
    <div style="width:100%;max-width:340px;text-align:center;">
      <div style="width:64px;height:64px;border-radius:16px;background:var(--red,#CC0000);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 16px;">🔧</div>
      <div style="font-size:20px;font-weight:800;color:var(--text,#fff);">Flota Vicuña</div>
      <div style="font-size:13px;color:var(--text3,#888);margin-bottom:24px;">Ingresá tu PIN de acceso</div>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="8" placeholder="••••"
        style="width:100%;text-align:center;font-size:26px;letter-spacing:8px;padding:14px;border-radius:12px;border:1.5px solid var(--border,#333);background:var(--card,#1a1a1a);color:var(--text,#fff);margin-bottom:12px;"
        onkeydown="if(event.key==='Enter')validarPin()">
      <button onclick="validarPin()" style="width:100%;padding:14px;border-radius:12px;background:var(--red,#CC0000);color:#fff;border:none;font-weight:700;font-size:16px;">Ingresar</button>
      <div id="pinError" style="font-size:13px;color:#FF6B6B;margin-top:12px;min-height:18px;"></div>
    </div>`;
  document.body.appendChild(ov);
  setTimeout(()=>{ const i=document.getElementById('pinInput'); if(i) i.focus(); }, 100);
}

function validarPin(){
  const inp = document.getElementById('pinInput');
  const err = document.getElementById('pinError');
  const val = (inp?.value||'').trim();
  if(val === PIN_ADMIN){ userRole='admin'; }
  else if(val === PIN_SUPERVISOR){ userRole='supervisor'; }
  else if(val === PIN_SUPERVISOR_VICUNA){ userRole='supervisor_vicuna'; }
  else { if(err) err.textContent='PIN incorrecto'; if(inp){ inp.value=''; inp.focus(); } return; }
  sessionStorage.setItem('fv_role', userRole);
  document.getElementById('loginOverlay')?.remove();
  aplicarRol();
}

function accesoLogout(){
  sessionStorage.removeItem('fv_role');
  location.reload();
}

const NOMBRE_ROL = { admin:'Admin', supervisor:'Supervisor', supervisor_vicuna:'Supervisor Vicuña' };

// Aplica las restricciones visuales según el rol
function aplicarRol(){
  document.body.setAttribute('data-role', userRole);
  const permitidas = TABS_POR_ROL[userRole]; // null/undefined = sin restricción (admin)

  // Ocultar pestañas que no correspondan al rol
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    const oc = btn.getAttribute('onclick')||'';
    const m = oc.match(/setTab\('(\w+)'/);
    const tabName = m ? m[1] : '';
    const oculta = permitidas && permitidas.indexOf(tabName) === -1;
    btn.style.display = oculta ? 'none' : '';
  });

  if(permitidas && permitidas.indexOf(curTab) === -1){
    // la pestaña actual no está permitida: forzar a la primera permitida
    curTab = permitidas[0];
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    const tb = Array.from(document.querySelectorAll('.tab-btn')).find(b=>(b.getAttribute('onclick')||'').indexOf("setTab('"+curTab+"'")>-1);
    if(tb) tb.classList.add('active');
    if(typeof render==='function') render();
  }

  // Ocultar el/los botones de "Nuevo turno" para roles sin permiso de carga
  const SIN_AGREGAR_TURNO = ['supervisor_vicuna'];
  if(SIN_AGREGAR_TURNO.indexOf(userRole) > -1){
    document.querySelectorAll('.btn-add-nav, .fab').forEach(b=> b.style.display='none');
  }

  // Etiqueta visible de modo solo lectura
  if (soloLectura()) {
    const bs = document.getElementById('brandSub');
    if (bs && bs.textContent.indexOf('Solo lectura') === -1) bs.textContent += ' · Solo lectura';
  }

  // Botón de salir en el header (para poder cambiar de usuario)
  if(!document.getElementById('logoutBtn')){
    const add = document.querySelector('.btn-add-nav');
    if(add && add.parentElement){
      const lo = document.createElement('button');
      lo.id='logoutBtn';
      lo.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5v9"/><path d="M17.7 6.3a8.5 8.5 0 1 1-11.4 0"/></svg>';
      lo.title = 'Salir ('+(NOMBRE_ROL[userRole]||userRole)+')';
      lo.setAttribute('aria-label','Salir');
      lo.style.cssText='background:rgba(255,255,255,.15);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:16px;margin-left:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;';
      lo.onclick = accesoLogout;
      add.parentElement.insertBefore(lo, add.nextSibling);
    }
  }
  try{ setTimeout(fvAbrirDesdeQR, 500); }catch(e){}
}

/* ── Guardias de solo lectura ──────────────────────────────────────────────
   Toda función que modifica, carga o descarga queda bloqueada para el rol de
   solo lectura (Supervisor Vicuña). Es la segunda capa: los botones ya no se
   dibujan para ese rol, y aun así, si alguien llegara a invocar la función
   (consola, caché vieja, etc.) no hace nada. La primera barrera de escritura
   está en la guardia de Firebase (ver _guardRef). */
const FUNCIONES_SOLO_ESCRITURA = [
  // turnos
  'openAdd','saveEv','toggleCumplidoEv','toggleEvTask','delEv',
  // plan PM
  'toggleEditMode','toggleTaskDone','deleteTask','addTask','editTask','saveTask','removeRepFromTask','importRepuestos',
  // cargas (Excel / PDF)
  'importarTurnosExcel','importarEstadoPago','importarRosterReparaciones','openImportModal','otHandleFiles','otConfirmImport',
  // correcciones masivas
  'convertirPredictivosAInsp','convertirPM10aPM5','corregirFechasOT2020','limpiarDuplicadosOT',
  // descargas / informes
  'openInformeModal','generarInforme','openPresupuestoModal','generarPresupuestoPDF','openRemitoModal','generarRemitoPDF',
  'openInformeEjecutivo','generarInformePDF','generarInformeWord','openInformeCompleto','generarInformeCompletoPDF',
  'generarInformeCompletoWord','generarPlanillaKPI','generarInformeKPIWord',
  // dashboard
  'toggleKpiSeg'
];
FUNCIONES_SOLO_ESCRITURA.forEach(function(nombre){
  const orig = window[nombre];
  if (typeof orig !== 'function') { console.warn('guardia solo lectura: no existe', nombre); return; }
  window[nombre] = function(){
    if (soloLectura()) { console.info('Modo solo lectura: acción bloqueada (' + nombre + ')'); return; }
    return orig.apply(this, arguments);
  };
});

// Arrancar el control de acceso cuando el DOM esté listo
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', ()=>setTimeout(accesoInit, 200));
} else {
  setTimeout(accesoInit, 200);
}

</script>
</body>
